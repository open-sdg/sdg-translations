1-1-title: 'ພາຍໃນປີ 2030, ລຶບລ້າງຄວາມທຸກຍາກທີ່ສຸດໃຫ້ໝົດໄປສຳລັບທຸກຄົນໃນທຸກຫົນແຫ່ງ,
  ເຊິ່ງປັດຈຸບັນວັດແທກຈາກຄົນທີ່ມີລາຍໄດ້ຕໍ່າກວ່າ 1.25 ໂດລາຕໍ່ມື້'
1-2-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນອັດຕາສ່ວນຂອງຜູ້ຊາຍ, ແມ່ຍິງ ແລະ ເດັກນ້ອຍໃນທຸກເກນອາຍຸ
  ທີ່ດຳລົງຊີວິດຢູ່ໃນຄວາມທຸກຍາກໃນທຸກມິຕິ ຕາມການກຳນົດຂອງຊາດ ໃຫ້ຫຼຸດລົງຢ່າງໜ້ອຍເຄິ່ງໜຶ່ງ'
1-3-title: 'ຈັດຕັ້ງປະຕິບັດລະບົບ ແລະ ມາດຕະການປົກປ້ອງທາງສັງຄົມທີ່ເໝາະສົມກັບສະພາບຂອງຊາດສຳລັບທຸກຄົນ,
  ລວມທັງການປົກປ້ອງລະດັບພື້ນຖານ ແລະ ພາຍໃນປີ 2030 ບັນລຸການຄຸ້ມຄອງກຸ່ມຄົນທຸກຍາກ ແລະ ຜູ້ດ້ອຍໂອກາດໃຫ້ໄດ້ຢ່າງກວ້າງຂວາງ'
1-4-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນໃຫ້ຊາຍ ແລະ ຍິງທຸກຄົນ, ໂດຍສະເພາະແມ່ນຜູ້ທຸກຍາກ ແລະ
  ຜູ້ດ້ອຍໂອກາດ, ມີສິດເທົ່າທຽມກັນໃນການເຂົ້າເຖິງຊັບພະຍາກອນທາງເສດຖະກິດ, ການບໍລິການຂັ້ນພື້ນຖານ,
  ການເປັນເຈົ້າຂອງ ແລະ ການຄວບຄຸມທີ່ດິນ ແລະ ຊັບສິນຮູບແບບອື່ນໆ, ມູນມໍລະດົກ, ຊັບພະຍາກອນທຳມະຊາດ,
  ເຕັກໂນໂລຊີໃໝ່ທີ່ເໝາະສົມ ແລະ ການບໍລິການທາງດ້ານການເງິນ, ລວມທັງການເງິນຈຸລະພາກ'
1-5-title: 'ພາຍໃນປີ 2030, ສ້າງຄວາມສາມາດໃນການຟື້ນຕົວໃຫ້ແກ່ຜູ້ທຸກຍາກ ແລະ ຜູ້ທີ່ຢູ່ໃນສະຖານະການບອບບາງ
  ແລະ ຫຼຸດຜ່ອນການເຜີຍຕົວຕໍ່ຄວາມສ່ຽງຈາກເຫດການທີ່ຮຸນແຮງທີ່ກ່ຽວຂ້ອງກັບສະພາບພູມອາກາດ,
  ລວມທັງວິກິດການ ແລະ ໄພພິບັດທາງດ້ານເສດຖະກິດ, ສັງຄົມ ແລະ ສິ່ງແວດລ້ອມ'
1-a-title: 'ຮັບປະກັນການລະດົມຊັບພະຍາກອນຢ່າງຫຼວງຫຼາຍຈາກຫຼາຍແຫຼ່ງ, ລວມທັງການເພີ່ມທະວີການຮ່ວມມືເພື່ອການພັດທະນາ,
  ເພື່ອສະໜອງທຶນຮອນທີ່ພຽງພໍ ແລະ ສາມາດຄາດການໄດ້ໃຫ້ແກ່ປະເທດກຳລັງພັດທະນາ, ໂດຍສະເພາະປະເທດດ້ອຍພັດທະນາ,
  ເພື່ອຈັດຕັ້ງປະຕິບັດແຜນງານ ແລະ ນະໂຍບາຍຕ່າງໆໃນການຢຸດຕິຄວາມທຸກຍາກໃນທຸກມິຕິ'
1-b-title: 'ສ້າງຂອບນະໂຍບາຍທີ່ເຂັ້ມແຂງໃນລະດັບຊາດ, ພາກພື້ນ ແລະ ສາກົນ, ໂດຍອີງໃສ່ຍຸດທະສາດການພັດທະນາທີ່ເອື້ອອຳນວຍຕໍ່ຄົນທຸກຍາກ
  ແລະ ຄຳນຶງເຖິງບົດບາດຍິງ-ຊາຍ, ເພື່ອສະໜັບສະໜູນການລົງທຶນຢ່າງໄວວາໃນການຈັດຕັ້ງປະຕິບັດການລຶບລ້າງຄວາມທຸກຍາກ'
10-1-title: 'ພາຍໃນປີ 2030, ບັນລຸ ແລະ ຮັກສາການເຕີບໂຕຂອງລາຍໄດ້ຂອງປະຊາກອນກຸ່ມທີ່ມີລາຍໄດ້ຕໍ່າສຸດ
  40 ເປີເຊັນ ໃຫ້ຢູ່ໃນອັດຕາທີ່ສູງກວ່າລະດັບສະເລ່ຍຂອງຊາດຢ່າງຕໍ່ເນື່ອງ'
10-2-title: 'ພາຍໃນປີ 2030, ສ້າງຄວາມເຂັ້ມແຂງ ແລະ ສົ່ງເສີມການມີສ່ວນຮ່ວມທາງດ້ານສັງຄົມ,
  ເສດຖະກິດ ແລະ ການເມືອງຂອງທຸກຄົນ, ໂດຍບໍ່ຈຳແນກອາຍຸ, ເພດ, ຄວາມພິການ, ເຊື້ອຊາດ, ຊົນເຜົ່າ,
  ຕົ້ນກຳເນີດ, ສາສະໜາ ຫຼື ສະຖານະພາບທາງເສດຖະກິດ ແລະ ອື່ນໆ'
10-3-title: 'ຮັບປະກັນໂອກາດທີ່ເທົ່າທຽມກັນ ແລະ ຫຼຸດຜ່ອນຄວາມບໍ່ສະເໝີພາບຂອງຜົນໄດ້ຮັບ,
  ລວມທັງການລົບລ້າງກົດໝາຍ, ນະໂຍບາຍ ແລະ ການປະຕິບັດທີ່ມີລັກສະນະຈຳແນກ ແລະ ສົ່ງເສີມນິຕິກຳ,
  ນະໂຍບາຍ ແລະ ການກະທຳທີ່ເໝາະສົມໃນເລື່ອງນີ້'
10-4-title: 'ຮັບຮອງເອົານະໂຍບາຍຕ່າງໆ, ໂດຍສະເພາະແມ່ນນະໂຍບາຍດ້ານການເງິນ, ຄ່າຈ້າງ ແລະ
  ການປົກປ້ອງສັງຄົມ, ແລະ ບັນລຸຄວາມສະເໝີພາບຫຼາຍຂຶ້ນເທື່ອລະກ້າວ'
10-5-title: 'ປັບປຸງລະບຽບການ ແລະ ການຕິດຕາມກວດກາຕະຫຼາດ ແລະ ສະຖາບັນການເງິນທົ່ວໂລກ ແລະ
  ສ້າງຄວາມເຂັ້ມແຂງໃນການຈັດຕັ້ງປະຕິບັດລະບຽບການດັ່ງກ່າວ'
10-6-title: 'ຮັບປະກັນການເພີ່ມບົດບາດການເປັນຕົວແທນ ແລະ ສຽງຂອງປະເທດກຳລັງພັດທະນາໃນການຕັດສິນໃຈຂອງສະຖາບັນເສດຖະກິດ
  ແລະ ການເງິນສາກົນທົ່ວໂລກ ເພື່ອໃຫ້ເປັນສະຖາບັນທີ່ມີປະສິດທິຜົນ, ໜ້າເຊື່ອຖື, ມີຄວາມຮັບຜິດຊອບ
  ແລະ ຖືກຕ້ອງຕາມກົດໝາຍ'
10-7-title: 'ອຳນວຍຄວາມສະດວກໃຫ້ແກ່ການຍ້າຍຖິ່ນຖານ ແລະ ການເຄື່ອນຍ້າຍຂອງປະຊາກອນຢ່າງເປັນລະບຽບ,
  ປອດໄພ, ເປັນປົກກະຕິ ແລະ ມີຄວາມຮັບຜິດຊອບ, ລວມທັງຜ່ານການຈັດຕັ້ງປະຕິບັດນະໂຍບາຍການຍ້າຍຖິ່ນຖານທີ່ມີການວາງແຜນ
  ແລະ ຄຸ້ມຄອງທີ່ດີ'
10-a-title: 'ຈັດຕັ້ງປະຕິບັດຫຼັກການປະຕິບັດແບບພິເສດ ແລະ ແຕກຕ່າງສຳລັບປະເທດກຳລັງພັດທະນາ,
  ໂດຍສະເພາະປະເທດດ້ອຍພັດທະນາ, ໃຫ້ສອດຄ່ອງກັບຂໍ້ຕົກລົງຂອງອົງການການຄ້າໂລກ'
10-b-title: 'ຊຸກຍູ້ການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ແລະ ກະແສການເງິນ, ລວມທັງການລົງທຶນໂດຍກົງຈາກຕ່າງປະເທດ
  ໄປຍັງບັນດາລັດທີ່ມີຄວາມຕ້ອງການຫຼາຍທີ່ສຸດ, ໂດຍສະເພາະປະເທດດ້ອຍພັດທະນາ, ປະເທດໃນອາຟຣິກາ,
  ລັດເກາະນ້ອຍທີ່ກຳລັງພັດທະນາ ແລະ ປະເທດກຳລັງພັດທະນາທີ່ບໍ່ມີຊາຍແດນຕິດຈອດກັບທະເລ, ໃຫ້ສອດຄ່ອງກັບແຜນການ
  ແລະ ແຜນງານແຫ່ງຊາດຂອງພວກເຂົາ'
10-c-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນຄ່າທຳນຽມການໂອນເງິນກັບຄືນປະເທດຂອງແຮງງານຍ້າຍຖິ່ນໃຫ້ຕໍ່າກວ່າ
  3 ເປີເຊັນ ແລະ ລົບລ້າງຊ່ອງທາງການໂອນເງິນທີ່ມີຕົ້ນທຶນສູງກວ່າ 5 ເປີເຊັນ'
11-1-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນການເຂົ້າເຖິງທີ່ພັກອາໄສ ແລະ ການບໍລິການຂັ້ນພື້ນຖານທີ່ພຽງພໍ,
  ປອດໄພ ແລະ ລາຄາບໍ່ແພງສຳລັບທຸກຄົນ ແລະ ຍົກລະດັບເຂດຊຸມຊົນແອອັດ'
11-2-title: 'ພາຍໃນປີ 2030, ສະໜອງການເຂົ້າເຖິງລະບົບການຂົນສົ່ງທີ່ປອດໄພ, ລາຄາບໍ່ແພງ ແລະ
  ຍືນຍົງສຳລັບທຸກຄົນ, ປັບປຸງຄວາມປອດໄພທາງຖະໜົນ, ໂດຍສະເພາະແມ່ນການຂະຫຍາຍການຂົນສົ່ງສາທາລະນະ,
  ໂດຍເອົາໃຈໃສ່ເປັນພິເສດຕໍ່ຄວາມຕ້ອງການຂອງຜູ້ທີ່ຢູ່ໃນສະຖານະການບອບບາງ, ແມ່ຍິງ, ເດັກນ້ອຍ,
  ຄົນພິການ ແລະ ຜູ້ສູງອາຍຸ'
11-3-title: 'ພາຍໃນປີ 2030, ເພີ່ມທະວີການຫັນເປັນຕົວເມືອງທີ່ທຸກກຸ່ມຄົນມີສ່ວນຮ່ວມ ແລະ
  ຍືນຍົງ, ພ້ອມທັງເພີ່ມຂີດຄວາມສາມາດໃນການວາງແຜນ ແລະ ການຄຸ້ມຄອງການຕັ້ງຖິ່ນຖານຂອງມະນຸດແບບມີສ່ວນຮ່ວມ
  ແລະ ປະສົມປະສານໃນທຸກປະເທດ'
11-4-title: 'ເພີ່ມທະວີຄວາມພະຍາຍາມໃນການປົກປັກຮັກສາ ແລະ ຊ່ວຍເຫຼືອມໍລະດົກທາງວັດທະນະທຳ
  ແລະ ທາງທຳມະຊາດຂອງໂລກ'
11-5-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນຈຳນວນຜູ້ເສຍຊີວິດ ແລະ ຜູ້ທີ່ໄດ້ຮັບຜົນກະທົບຢ່າງຫຼວງຫຼາຍ
  ແລະ ຫຼຸດຜ່ອນການສູນເສຍທາງເສດຖະກິດໂດຍກົງທີ່ກ່ຽວຂ້ອງກັບຜະລິດຕະພັນພາຍໃນລວມ (GDP) ທົ່ວໂລກ
  ທີ່ເກີດຈາກໄພພິບັດ, ລວມທັງໄພພິບັດທີ່ກ່ຽວຂ້ອງກັບນໍ້າ, ໂດຍສຸມໃສ່ການປົກປ້ອງຜູ້ທຸກຍາກ
  ແລະ ຜູ້ທີ່ຢູ່ໃນສະຖານະການບອບບາງ'
11-6-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນຜົນກະທົບທາງລົບຕໍ່ສິ່ງແວດລ້ອມຕໍ່ຫົວຄົນໃນເຂດຕົວເມືອງ,
  ລວມທັງການເອົາໃຈໃສ່ເປັນພິເສດຕໍ່ຄຸນນະພາບອາກາດ ແລະ ການຄຸ້ມຄອງສິ່ງເສດເຫຼືອຂອງເທດສະບານ
  ແລະ ອື່ນໆ'
11-7-title: 'ພາຍໃນປີ 2030, ສະໜອງການເຂົ້າເຖິງພື້ນທີ່ສາທາລະນະ ແລະ ພື້ນທີ່ສີຂຽວທີ່ປອດໄພ
  ແລະ ສະດວກສຳລັບທຸກຄົນ, ໂດຍສະເພາະສຳລັບແມ່ຍິງ ແລະ ເດັກນ້ອຍ, ຜູ້ສູງອາຍຸ ແລະ ຄົນພິການ'
11-a-title: 'ສະໜັບສະໜູນການເຊື່ອມໂຍງທາງດ້ານເສດຖະກິດ, ສັງຄົມ ແລະ ສິ່ງແວດລ້ອມໃນທາງບວກ
  ລະຫວ່າງເຂດຕົວເມືອງ, ເຂດຊານເມືອງ ແລະ ເຂດຊົນນະບົດ ໂດຍການສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ການວາງແຜນພັດທະນາລະດັບຊາດ
  ແລະ ລະດັບພາກພື້ນ'
11-b-title: 'ພາຍໃນປີ 2020, ເພີ່ມຈຳນວນຕົວເມືອງ ແລະ ການຕັ້ງຖິ່ນຖານຂອງມະນຸດທີ່ຮັບຮອງເອົາ
  ແລະ ຈັດຕັ້ງປະຕິບັດນະໂຍບາຍ ແລະ ແຜນການແບບປະສົມປະສານ ເພື່ອການມີສ່ວນຮ່ວມ, ການນຳໃຊ້ຊັບພະຍາກອນຢ່າງມີປະສິດທິພາບ,
  ການຫຼຸດຜ່ອນ ແລະ ການປັບຕົວເຂົ້າກັບການປ່ຽນແປງສະພາບພູມອາກາດ, ຄວາມສາມາດໃນການຮັບມືກັບໄພພິບັດ,
  ພ້ອມທັງພັດທະນາ ແລະ ຈັດຕັ້ງປະຕິບັດການຄຸ້ມຄອງຄວາມສ່ຽງໄພພິບັດແບບຮອບດ້ານໃນທຸກລະດັບ ໃຫ້ສອດຄ່ອງກັບຂອບເຊັນໄດ
  (Sendai Framework) ເພື່ອການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດ 2015-2030'
11-c-title: 'ສະໜັບສະໜູນປະເທດດ້ອຍພັດທະນາ, ລວມທັງຜ່ານການຊ່ວຍເຫຼືອທາງດ້ານການເງິນ ແລະ
  ເຕັກນິກ ໃນການກໍ່ສ້າງອາຄານທີ່ຍືນຍົງ ແລະ ທົນທານ ໂດຍການນຳໃຊ້ວັດສະດຸພາຍໃນທ້ອງຖິ່ນ'
12-1-title: 'ຈັດຕັ້ງປະຕິບັດຂອບແຜນງານ 10 ປີ ວ່າດ້ວຍຮູບແບບການບໍລິໂພກ ແລະ ການຜະລິດທີ່ຍືນຍົງ
  ໂດຍທຸກປະເທດຕ້ອງຮ່ວມກັນດຳເນີນການ ແລະ ໃຫ້ປະເທດພັດທະນາແລ້ວເປັນຜູ້ນຳໜ້າ, ໂດຍຄຳນຶງເຖິງລະດັບການພັດທະນາ
  ແລະ ຂີດຄວາມສາມາດຂອງປະເທດກຳລັງພັດທະນາ'
12-2-title: 'ພາຍໃນປີ 2030, ບັນລຸການຄຸ້ມຄອງທີ່ຍືນຍົງ ແລະ ການນຳໃຊ້ຊັບພະຍາກອນທຳມະຊາດຢ່າງມີປະສິດທິພາບ'
12-3-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນຂີ້ເຫຍື້ອຈາກອາຫານທົ່ວໂລກຕໍ່ຫົວຄົນໃນລະດັບການຂາຍຍ່ອຍ
  ແລະ ຜູ້ບໍລິໂພກລົງເຄິ່ງໜຶ່ງ ແລະ ຫຼຸດຜ່ອນການສູນເສຍອາຫານຕະຫຼອດຕ່ອງໂສ້ການຜະລິດ ແລະ ການສະໜອງ,
  ລວມທັງການສູນເສຍຫຼັງການເກັບກ່ຽວ'
12-4-title: 'ພາຍໃນປີ 2020, ບັນລຸການຄຸ້ມຄອງສານເຄມີ ແລະ ສິ່ງເສດເຫຼືອທັງໝົດທີ່ເປັນມິດກັບສິ່ງແວດລ້ອມຕະຫຼອດວົງຈອນຊີວິດຂອງພວກເຂົາ,
  ໃຫ້ສອດຄ່ອງກັບຂອບວຽກສາກົນທີ່ໄດ້ຕົກລົງກັນ, ແລະ ຫຼຸດຜ່ອນການປ່ອຍສານເຫຼົ່ານັ້ນສູ່ອາກາດ,
  ນໍ້າ ແລະ ດິນຢ່າງຫຼວງຫຼາຍ ເພື່ອຫຼຸດຜ່ອນຜົນກະທົບທາງລົບຕໍ່ສຸຂະພາບຂອງມະນຸດ ແລະ ສິ່ງແວດລ້ອມໃຫ້ໜ້ອຍທີ່ສຸດ'
12-5-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນການເກີດສິ່ງເສດເຫຼືອຢ່າງຫຼວງຫຼາຍ ໂດຍຜ່ານການປ້ອງກັນ,
  ການຫຼຸດຜ່ອນ, ການນຳກັບມາໃຊ້ໃໝ່ ແລະ ການນຳໃຊ້ຄືນ'
12-6-title: 'ຊຸກຍູ້ໃຫ້ບໍລິສັດຕ່າງໆ, ໂດຍສະເພາະບໍລິສັດຂະໜາດໃຫຍ່ ແລະ ບໍລິສັດຂ້າມຊາດ,
  ຮັບຮອງເອົາການປະຕິບັດທີ່ຍືນຍົງ ແລະ ລວມເອົາຂໍ້ມູນດ້ານຄວາມຍືນຍົງເຂົ້າໃນຮອບວຽນການລາຍງານຂອງພວກເຂົາ'
12-7-title: 'ສົ່ງເສີມການປະຕິບັດການຈັດຊື້-ຈັດຈ້າງຂອງລັດທີ່ຍືນຍົງ, ໃຫ້ສອດຄ່ອງກັບນະໂຍບາຍ
  ແລະ ບຸລິມະສິດແຫ່ງຊາດ'
12-8-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນໃຫ້ປະຊາຊົນໃນທຸກຫົນແຫ່ງມີຂໍ້ມູນ ແລະ ຄວາມຮັບຮູ້ທີ່ກ່ຽວຂ້ອງ
  ເພື່ອການພັດທະນາທີ່ຍືນຍົງ ແລະ ວິຖີຊີວິດທີ່ສອດຄ່ອງກັບທຳມະຊາດ'
12-a-title: 'ສະໜັບສະໜູນປະເທດກຳລັງພັດທະນາໃນການສ້າງຄວາມເຂັ້ມແຂງດ້ານວິທະຍາສາດ ແລະ ເຕັກໂນໂລຊີ
  ເພື່ອກ້າວໄປສູ່ຮູບແບບການບໍລິໂພກ ແລະ ການຜະລິດທີ່ຍືນຍົງກວ່າ'
12-b-title: 'ພັດທະນາ ແລະ ນຳໃຊ້ເຄື່ອງມືເພື່ອຕິດຕາມຜົນກະທົບດ້ານການພັດທະນາທີ່ຍືນຍົງ ສຳລັບການທ່ອງທ່ຽວແບບຍືນຍົງ
  ທີ່ສ້າງວຽກເຮັດງານທຳ ແລະ ສົ່ງເສີມວັດທະນະທຳ ແລະ ຜະລິດຕະພັນທ້ອງຖິ່ນ'
12-c-title: 'ປັບປຸງການອຸດໜູນນໍ້າມັນເຊື້ອໄຟຟອດຊິວທີ່ບໍ່ມີປະສິດທິຜົນ ທີ່ສົ່ງເສີມການບໍລິໂພກທີ່ຟຸ່ມເຟືອຍ
  ໂດຍການກຳຈັດສິ່ງບິດເບືອນຂອງຕະຫຼາດໃຫ້ສອດຄ່ອງກັບສະພາບການຂອງຊາດ, ລວມທັງການປັບໂຄງສ້າງພາສີ
  ແລະ ຍົກເລີກການອຸດໜູນທີ່ເປັນອັນຕະລາຍເຫຼົ່ານັ້ນ ເພື່ອໃຫ້ສະທ້ອນເຖິງຜົນກະທົບຕໍ່ສິ່ງແວດລ້ອມ,
  ໂດຍຄຳນຶງເຖິງຄວາມຕ້ອງການ ແລະ ເງື່ອນໄຂສະເພາະຂອງປະເທດກຳລັງພັດທະນາ ແລະ ຫຼຸດຜ່ອນຜົນກະທົບທາງລົບຕໍ່ການພັດທະນາຂອງພວກເຂົາ
  ໃນລັກສະນະທີ່ປົກປ້ອງຄົນທຸກຍາກ ແລະ ຊຸມຊົນທີ່ໄດ້ຮັບຜົນກະທົບ'
13-1-title: 'ສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ຄວາມສາມາດໃນການຮັບມື ແລະ ການປັບຕົວຕໍ່ກັບໄພອັນຕະລາຍທີ່ກ່ຽວຂ້ອງກັບສະພາບພູມອາກາດ
  ແລະ ໄພພິບັດທາງທຳມະຊາດໃນທຸກປະເທດ'
13-2-title: 'ລວມເອົາມາດຕະການການປ່ຽນແປງສະພາບພູມອາກາດເຂົ້າໃນນະໂຍບາຍ, ຍຸດທະສາດ ແລະ ແຜນການລະດັບຊາດ'
13-3-title: 'ປັບປຸງການສຶກສາ, ການສ້າງຈິດສຳນຶກ ພ້ອມທັງຂີດຄວາມສາມາດຂອງບຸກຄະລາກອນ ແລະ
  ສະຖາບັນ ກ່ຽວກັບການຫຼຸດຜ່ອນການປ່ຽນແປງສະພາບພູມອາກາດ, ການປັບຕົວ, ການຫຼຸດຜ່ອນຜົນກະທົບ
  ແລະ ການເຕືອນໄພລ່ວງໜ້າ'
13-a-title: 'ຈັດຕັ້ງປະຕິບັດຄຳໝັ້ນສັນຍາຂອງບັນດາປະເທດພັດທະນາແລ້ວ ທີ່ເປັນພາຄີຂອງສົນທິສັນຍາຂອບສະຫະປະຊາຊາດວ່າດ້ວຍການປ່ຽນແປງສະພາບພູມອາກາດ
  ເພື່ອບັນລຸເປົ້າໝາຍການລະດົມທຶນຮ່ວມກັນໃຫ້ໄດ້ 100 ຕື້ໂດລາຕໍ່ປີ ພາຍໃນປີ 2020 ຈາກທຸກແຫຼ່ງທຶນ
  ເພື່ອຕອບສະໜອງຄວາມຕ້ອງການຂອງປະເທດກຳລັງພັດທະນາ ແລະ ດຳເນີນງານກອງທຶນພູມອາກາດສີຂຽວ (Green
  Climate Fund) ໃຫ້ເຕັມຮູບແບບໂດຍໄວທີ່ສຸດ'
13-b-title: 'ສົ່ງເສີມກົນໄກການເພີ່ມຂີດຄວາມສາມາດໃນການວາງແຜນ ແລະ ການຄຸ້ມຄອງທີ່ກ່ຽວຂ້ອງກັບການປ່ຽນແປງສະພາບພູມອາກາດທີ່ມີປະສິດທິຜົນ
  ໃນປະເທດດ້ອຍພັດທະນາ ແລະ ລັດເກາະນ້ອຍທີ່ກຳລັງພັດທະນາ, ລວມທັງການສຸມໃສ່ແມ່ຍິງ, ຊາວໜຸ່ມ
  ແລະ ຊຸມຊົນທ້ອງຖິ່ນທີ່ດ້ອຍໂອກາດ'
14-1-title: 'ພາຍໃນປີ 2025, ປ້ອງກັນ ແລະ ຫຼຸດຜ່ອນມົນລະພິດທາງທະເລທຸກຮູບແບບຢ່າງຫຼວງຫຼາຍ,
  ໂດຍສະເພາະແມ່ນຈາກກິດຈະກຳທາງບົກ, ລວມທັງເສດຂີ້ເຫຍື້ອໃນທະເລ ແລະ ມົນລະພິດຈາກທາດອາຫານ'
14-2-title: 'ພາຍໃນປີ 2020, ຄຸ້ມຄອງ ແລະ ປົກປ້ອງລະບົບນິເວດທາງທະເລ ແລະ ຊາຍຝັ່ງທະເລຢ່າງຍືນຍົງ
  ເພື່ອຫຼີກລ້ຽງຜົນກະທົບທາງລົບທີ່ຮຸນແຮງ, ລວມທັງສ້າງຄວາມເຂັ້ມແຂງໃນການຟື້ນຕົວ ແລະ ດຳເນີນການຟື້ນຟູເພື່ອໃຫ້ມະຫາສະໝຸດມີຄວາມອຸດົມສົມບູນ'
14-3-title: 'ຫຼຸດຜ່ອນ ແລະ ແກ້ໄຂຜົນກະທົບຈາກພາວະນໍ້າທະເລເປັນກົດ, ລວມທັງຜ່ານການເພີ່ມທະວີການຮ່ວມມືທາງດ້ານວິທະຍາສາດໃນທຸກລະດັບ'
14-4-title: 'ພາຍໃນປີ 2020, ກວດກາການເກັບກ່ຽວຜົນຜະລິດທາງທະເລຢ່າງມີປະສິດທິຜົນ ແລະ ຢຸດຕິການຫາປາເກີນຂອບເຂດ,
  ການຫາປາທີ່ຜິດກົດໝາຍ, ບໍ່ມີການລາຍງານ ແລະ ບໍ່ມີລະບຽບການ (IUU) ແລະ ການຫາປາທີ່ທຳລາຍລະບົບນິເວດ'
14-5-title: 'ພາຍໃນປີ 2020, ອະນຸລັກເຂດຊາຍຝັ່ງ ແລະ ເຂດທະເລຢ່າງໜ້ອຍ 10 ເປີເຊັນ, ໃຫ້ສອດຄ່ອງກັບກົດໝາຍພາຍໃນ
  ແລະ ສາກົນ'
14-6-title: 'ພາຍໃນປີ 2020, ຫ້າມການອຸດໜູນການປະມົງບາງຮູບແບບທີ່ພາໃຫ້ເກີດການຫາປາເກີນຂອບເຂດ
  ແລະ ການຫາປາທີ່ຜິດກົດໝາຍ'
14-7-title: 'ພາຍໃນປີ 2030, ເພີ່ມຜົນປະໂຫຍດທາງເສດຖະກິດໃຫ້ແກ່ລັດເກາະນ້ອຍທີ່ກຳລັງພັດທະນາ
  ແລະ ປະເທດດ້ອຍພັດທະນາ ຈາກການນຳໃຊ້ຊັບພະຍາກອນທາງທະເລຢ່າງຍືນຍົງ'
14-a-title: 'ເພີ່ມພູນຄວາມຮູ້ທາງວິທະຍາສາດ, ພັດທະນາຂີດຄວາມສາມາດໃນການຄົ້ນຄວ້າ ແລະ ຖ່າຍທອດເຕັກໂນໂລຊີທາງທະເລ'
14-b-title: 'ສະໜອງການເຂົ້າເຖິງຊັບພະຍາກອນທາງທະເລ ແລະ ຕະຫຼາດ ໃຫ້ແກ່ຊາວປະມົງພື້ນບ້ານຂະໜາດນ້ອຍ'
14-c-title: 'ເພີ່ມທະວີການອະນຸລັກ ແລະ ການນຳໃຊ້ມະຫາສະໝຸດ ແລະ ຊັບພະຍາກອນທາງທະເລຢ່າງຍືນຍົງ
  ໂດຍການຈັດຕັ້ງປະຕິບັດກົດໝາຍສາກົນ'
15-1-title: 'ພາຍໃນປີ 2020, ຮັບປະກັນການອະນຸລັກ, ການຟື້ນຟູ ແລະ ການນຳໃຊ້ລະບົບນິເວດເທິງບົກ
  ແລະ ແຫຼ່ງນໍ້າຈືດຢ່າງຍືນຍົງ'
15-2-title: 'ພາຍໃນປີ 2020, ສົ່ງເສີມການຈັດຕັ້ງປະຕິບັດການຄຸ້ມຄອງປ່າໄມ້ທຸກປະເພດຢ່າງຍືນຍົງ,
  ຢຸດຕິການຕັດໄມ້ທຳລາຍປ່າ ແລະ ຟື້ນຟູປ່າໄມ້ທີ່ເຊື່ອມໂຊມ'
15-3-title: 'ພາຍໃນປີ 2030, ຕ້ານການກາຍເປັນທະເລຊາຍ, ຟື້ນຟູເນື້ອທີ່ດິນ ແລະ ດິນທີ່ເຊື່ອມໂຊມ'
15-4-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນການອະນຸລັກລະບົບນິເວດພູເຂົາ ລວມທັງຄວາມຫຼາກຫຼາຍທາງຊີວະນາໆພັນ'
15-5-title: 'ດຳເນີນການຢ່າງຮີບດ່ວນເພື່ອຫຼຸດຜ່ອນການເຊື່ອມໂຊມຂອງຖິ່ນທີ່ຢູ່ອາໄສຕາມທຳມະຊາດ
  ແລະ ປ້ອງກັນການສູນພັນຂອງສາຍພັນທີ່ຖືກຄຸກຄາມ'
15-6-title: 'ສົ່ງເສີມການແບ່ງປັນຜົນປະໂຫຍດຈາກການນຳໃຊ້ຊັບພະຍາກອນທາງພັນທຸກຳຢ່າງຍຸຕິທຳ
  ແລະ ເທົ່າທຽມ'
15-7-title: 'ດຳເນີນການຢ່າງຮີບດ່ວນເພື່ອຢຸດຕິການລັກລອບລ່າສັດ ແລະ ການຄ້າຂາຍສັດປ່າ ແລະ
  ພືດພັນທີ່ຫວງຫ້າມ'
15-8-title: 'ພາຍໃນປີ 2020, ນຳໃຊ້ມາດຕະການເພື່ອປ້ອງກັນ ແລະ ຫຼຸດຜ່ອນຜົນກະທົບຈາກສາຍພັນຕ່າງຖິ່ນທີ່ຮຸກຮານ'
15-9-title: 'ພາຍໃນປີ 2020, ລວມເອົາຄຸນຄ່າຂອງລະບົບນິເວດ ແລະ ຄວາມຫຼາກຫຼາຍທາງຊີວະນາໆພັນເຂົ້າໃນການວາງແຜນລະດັບຊາດ
  ແລະ ທ້ອງຖິ່ນ'
15-a-title: 'ລະດົມ ແລະ ເພີ່ມທຶນຮອນຈາກທຸກແຫຼ່ງເພື່ອການອະນຸລັກ ແລະ ການນຳໃຊ້ຊີວະນາໆພັນຢ່າງຍືນຍົງ'
15-b-title: 'ລະດົມຊັບພະຍາກອນຈາກທຸກລະດັບເພື່ອສະໜັບສະໜູນການຄຸ້ມຄອງປ່າໄມ້ຢ່າງຍືນຍົງ'
15-c-title: 'ເພີ່ມທະວີການສະໜັບສະໜູນທົ່ວໂລກໃນການຕໍ່ຕ້ານການລັກລອບລ່າສັດ ແລະ ການຄ້າຂາຍສັດປ່າຫວງຫ້າມ'
16-1-title: 'ຫຼຸດຜ່ອນຄວາມຮຸນແຮງທຸກຮູບແບບ ແລະ ອັດຕາການຕາຍທີ່ກ່ຽວຂ້ອງໃນທຸກຫົນແຫ່ງຢ່າງຫຼວງຫຼາຍ'
16-10-title: 'ຮັບປະກັນການເຂົ້າເຖິງຂໍ້ມູນຂ່າວສານຂອງສາທາລະນະຊົນ ແລະ ປົກປ້ອງສິດເສລີພາບຂັ້ນພື້ນຖານ'
16-2-title: 'ຢຸດຕິການລ່ວງລະເມີດ, ການຂູດຮີດ, ການຄ້າມະນຸດ ແລະ ຄວາມຮຸນແຮງທຸກຮູບແບບຕໍ່ເດັກ'
16-3-title: 'ສົ່ງເສີມການປົກຄອງດ້ວຍກົດໝາຍໃນລະດັບຊາດ ແລະ ສາກົນ ແລະ ຮັບປະກັນຄວາມຍຸຕິທຳສຳລັບທຸກຄົນຢ່າງເທົ່າທຽມ'
16-4-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນກະແສການເງິນ ແລະ ການຄ້າອາວຸດທີ່ຜິດກົດໝາຍຢ່າງຫຼວງຫຼາຍ'
16-5-title: 'ຫຼຸດຜ່ອນການສໍ້ລາດບັງຫຼວງ ແລະ ການໃຫ້ສິນບົນທຸກຮູບແບບຢ່າງຫຼວງຫຼາຍ'
16-6-title: 'ພັດທະນາສະຖາບັນທີ່ມີປະສິດທິຜົນ, ມີຄວາມຮັບຜິດຊອບ ແລະ ໂປ່ງໃສໃນທຸກລະດັບ'
16-7-title: 'ຮັບປະກັນການຕັດສິນໃຈທີ່ຕອບສະໜອງຕໍ່ຄວາມຕ້ອງການ, ມີສ່ວນຮ່ວມ ແລະ ເປັນຕົວແທນໃນທຸກລະດັບ'
16-8-title: 'ຂະຫຍາຍ ແລະ ເສີມສ້າງການມີສ່ວນຮ່ວມຂອງປະເທດກຳລັງພັດທະນາໃນສະຖາບັນຄຸ້ມຄອງລະດັບໂລກ'
16-9-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນໃຫ້ທຸກຄົນມີສະຖານະທາງກົດໝາຍ, ລວມທັງການຈົດທະບຽນເກີດ'
16-a-title: 'ສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ສະຖາບັນແຫ່ງຊາດ ເພື່ອປ້ອງກັນຄວາມຮຸນແຮງ ແລະ ຕ້ານການກໍ່ການຮ້າຍ'
16-b-title: 'ສົ່ງເສີມ ແລະ ບັງຄັບໃຊ້ກົດໝາຍ ແລະ ນະໂຍບາຍທີ່ບໍ່ມີລັກສະນະຈຳແນກ ເພື່ອການພັດທະນາທີ່ຍືນຍົງ'
17-1-title: 'ສ້າງຄວາມເຂັ້ມແຂງໃນການລະດົມຊັບພະຍາກອນພາຍໃນປະເທດ ເພື່ອປັບປຸງການເກັບພາສີ
  ແລະ ລາຍຮັບອື່ນໆ'
17-10-title: 'ສົ່ງເສີມລະບົບການຄ້າຫຼາຍຝ່າຍທີ່ເປີດກວ້າງ, ຍຸຕິທຳ ແລະ ບໍ່ຈຳແນກ ພາຍໃຕ້ອົງການການຄ້າໂລກ'
17-11-title: 'ເພີ່ມທະວີການສົ່ງອອກຂອງປະເທດກຳລັງພັດທະນາຢ່າງຫຼວງຫຼາຍ'
17-12-title: 'ຈັດຕັ້ງປະຕິບັດການເຂົ້າເຖິງຕະຫຼາດແບບປອດພາສີ ແລະ ປອດໂຄຕາສຳລັບປະເທດດ້ອຍພັດທະນາທຸກປະເທດ'
17-13-title: 'ເພີ່ມທະວີສະຖຽນລະພາບເສດຖະກິດມະຫາພາກທົ່ວໂລກ'
17-14-title: 'ເພີ່ມທະວີຄວາມສອດຄ່ອງດ້ານນະໂຍບາຍເພື່ອການພັດທະນາທີ່ຍືນຍົງ'
17-15-title: 'ເຄົາລົບຂອບເຂດນະໂຍບາຍ ແລະ ການນຳພາຂອງແຕ່ລະປະເທດໃນການກຳນົດນະໂຍບາຍລຶບລ້າງຄວາມທຸກຍາກ'
17-16-title: 'ເສີມສ້າງຄູ່ຮ່ວມມືທົ່ວໂລກເພື່ອການພັດທະນາທີ່ຍືນຍົງ'
17-17-title: 'ສົ່ງເສີມການຮ່ວມມືລະຫວ່າງພາກລັດ, ພາກເອກະຊົນ ແລະ ພາກປະຊາສັງຄົມທີ່ມີປະສິດທິຜົນ'
17-18-title: 'ພາຍໃນປີ 2020, ເພີ່ມການສະໜັບສະໜູນການສ້າງຂີດຄວາມສາມາດໃຫ້ແກ່ປະເທດກຳລັງພັດທະນາ
  ໃນການຈັດເກັບຂໍ້ມູນທີ່ມີຄຸນນະພາບ'
17-19-title: 'ພາຍໃນປີ 2030, ພັດທະນາມາດຕະການວັດແທກຄວາມຄືບໜ້າຂອງການພັດທະນາທີ່ຍືນຍົງ'
17-2-title: 'ໃຫ້ປະເທດພັດທະນາແລ້ວຈັດຕັ້ງປະຕິບັດຄຳໝັ້ນສັນຍາດ້ານການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ
  (ODA) ຢ່າງເຕັມສ່ວນ'
17-3-title: 'ລະດົມຊັບພະຍາກອນທາງການເງິນເພີ່ມເຕີມໃຫ້ແກ່ປະເທດກຳລັງພັດທະນາຈາກຫຼາຍແຫຼ່ງ'
17-4-title: 'ຊ່ວຍເຫຼືອປະເທດກຳລັງພັດທະນາໃນການສ້າງຄວາມຍືນຍົງດ້ານໜີ້ສິນໃນໄລຍະຍາວ'
17-5-title: 'ຮັບຮອງເອົາ ແລະ ຈັດຕັ້ງປະຕິບັດລະບຽບການສົ່ງເສີມການລົງທຶນສຳລັບປະເທດດ້ອຍພັດທະນາ'
17-6-title: 'ເພີ່ມທະວີການຮ່ວມມືລະຫວ່າງປະເທດແຖບເໜືອ-ໃຕ້ ແລະ ໃຕ້-ໃຕ້'
17-7-title: 'ສົ່ງເສີມການພັດທະນາ ແລະ ການຖ່າຍທອດເຕັກໂນໂລຊີທີ່ເປັນມິດກັບສິ່ງແວດລ້ອມ'
17-8-title: 'ດຳເນີນງານທະນາຄານເຕັກໂນໂລຊີ ແລະ ກົນໄກການສ້າງຂີດຄວາມສາມາດດ້ານວິທະຍາສາດ'
17-9-title: 'ເພີ່ມທະວີການສະໜັບສະໜູນສາກົນໃນການສ້າງຂີດຄວາມສາມາດທີ່ມີປະສິດທິຜົນ'
2-1-title: 'ພາຍໃນປີ 2030, ຢຸດຕິຄວາມອຶດຫິວ ແລະ ຮັບປະກັນໃຫ້ທຸກຄົນໄດ້ເຂົ້າເຖິງອາຫານທີ່ປອດໄພ
  ແລະ ມີໂພຊະນາການພຽງພໍຕະຫຼອດປີ'
2-2-title: 'ພາຍໃນປີ 2030, ຢຸດຕິການຂາດສານອາຫານທຸກຮູບແບບ ລວມທັງແກ້ໄຂບັນຫາເດັກເຕ້ຍ ແລະ
  ຈ່ອຍຜອມໃນເດັກອາຍຸຕໍ່າກວ່າ 5 ປີ'
2-3-title: 'ພາຍໃນປີ 2030, ເພີ່ມຜົນຜະລິດກະສິກຳ ແລະ ລາຍໄດ້ຂອງຜູ້ຜະລິດອາຫານຂະໜາດນ້ອຍໃຫ້ເປັນສອງເທົ່າ'
2-4-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນລະບົບການຜະລິດອາຫານທີ່ຍືນຍົງ ແລະ ນຳໃຊ້ການປະຕິບັດກະສິກຳທີ່ມີຄວາມທົນທານ'
2-5-title: 'ພາຍໃນປີ 2020, ຮັກສາຄວາມຫຼາກຫຼາຍທາງພັນທຸກຳຂອງແນວພັນພືດ ແລະ ສັດລ້ຽງ'
2-a-title: 'ເພີ່ມການລົງທຶນໃນພື້ນຖານໂຄງລ່າງຊົນນະບົດ ແລະ ການຄົ້ນຄວ້າກະສິກຳ'
2-b-title: 'ແກ້ໄຂ ແລະ ປ້ອງກັນຂໍ້ຈຳກັດທາງການຄ້າໃນຕະຫຼາດກະສິກຳໂລກ'
2-c-title: 'ນຳໃຊ້ມາດຕະການເພື່ອຮັບປະກັນການເຮັດວຽກທີ່ປົກກະຕິຂອງຕະຫຼາດສິນຄ້າອາຫານ'
3-1-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນອັດຕາການຕາຍຂອງແມ່ທົ່ວໂລກໃຫ້ຕໍ່າກວ່າ 70 ຄົນ ຕໍ່ການເກີດທີ່ມີຊີວິດ
  100,000 ຄົນ'
3-2-title: 'ພາຍໃນປີ 2030, ຢຸດຕິການຕາຍຂອງເດັກເກີດໃໝ່ ແລະ ເດັກອາຍຸຕໍ່າກວ່າ 5 ປີ ທີ່ສາມາດປ້ອງກັນໄດ້'
3-3-title: 'ພາຍໃນປີ 2030, ຢຸດຕິການລະບາດຂອງພະຍາດເອດ, ວັນນະໂລກ, ໄຂ້ຍຸງ ແລະ ພະຍາດເຂດຮ້ອນ'
3-4-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນການຕາຍກ່ອນໄວອັນຄວນຈາກພະຍາດບໍ່ຕິດຕໍ່ລົງໃຫ້ໄດ້ໜຶ່ງສ່ວນສາມ'
3-5-title: 'ສ້າງຄວາມເຂັ້ມແຂງໃນການປ້ອງກັນ ແລະ ປິ່ນປົວການໃຊ້ສານເສບຕິດ'
3-6-title: 'ພາຍໃນປີ 2020, ຫຼຸດຜ່ອນຈຳນວນຜູ້ເສຍຊີວິດ ແລະ ບາດເຈັບຈາກອຸປະຕິເຫດທາງຖະໜົນທົ່ວໂລກລົງເຄິ່ງໜຶ່ງ'
3-7-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນການເຂົ້າເຖິງການບໍລິການສຸຂະພາບທາງເພດ ແລະ ສຸຂະພາບຈະເລີນພັນຢ່າງທົ່ວເຖິງ'
3-8-title: 'ບັນລຸການຄຸ້ມຄອງສຸຂະພາບທົ່ວປວງຊົນ'
3-9-title: 'ພາຍໃນປີ 2030, ຫຼຸດຜ່ອນຈຳນວນຜູ້ເສຍຊີວິດ ແລະ ການເຈັບປ່ວຍຈາກສານເຄມີອັນຕະລາຍ
  ແລະ ມົນລະພິດ'
3-a-title: 'ສ້າງຄວາມເຂັ້ມແຂງໃນການຈັດຕັ້ງປະຕິບັດສົນທິສັນຍາຂອບຂອງອົງການອະນາໄມໂລກວ່າດ້ວຍການຄວບຄຸມຢາສູບ'
3-b-title: 'ສະໜັບສະໜູນການຄົ້ນຄວ້າ ແລະ ພັດທະນາວັກຊີນ ແລະ ຢາປິ່ນປົວພະຍາດ'
3-c-title: 'ເພີ່ມງົບປະມານດ້ານສາທາລະນະສຸກ ແລະ ການພັດທະນາບຸກຄະລາກອນທາງການແພດ'
3-d-title: 'ສ້າງຄວາມເຂັ້ມແຂງດ້ານຂີດຄວາມສາມາດໃນການເຕືອນໄພລ່ວງໜ້າ ແລະ ການຄຸ້ມຄອງຄວາມສ່ຽງດ້ານສຸຂະພາບ'
4-1-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນໃຫ້ເດັກຍິງ ແລະ ເດັກຊາຍທຸກຄົນໄດ້ຮຽນຈົບຊັ້ນປະຖົມ ແລະ
  ມັດທະຍົມ ໂດຍບໍ່ເສຍຄ່າ ແລະ ມີຄຸນນະພາບ'
4-2-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນໃຫ້ເດັກທຸກຄົນໄດ້ເຂົ້າເຖິງການພັດທະນາ ແລະ ການເບິ່ງແຍງເດັກກ່ອນໄວຮຽນທີ່ມີຄຸນນະພາບ'
4-3-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນການເຂົ້າເຖິງການສຶກສາວິຊາຊີບ ແລະ ຊັ້ນສູງຢ່າງເທົ່າທຽມ'
4-4-title: 'ພາຍໃນປີ 2030, ເພີ່ມຈຳນວນຊາວໜຸ່ມ ແລະ ຜູ້ໃຫຍ່ທີ່ມີທັກສະທີ່ຈຳເປັນຕໍ່ການເຮັດວຽກ'
4-5-title: 'ພາຍໃນປີ 2030, ລົບລ້າງຄວາມບໍ່ສະເໝີພາບທາງເພດໃນການສຶກສາ'
4-6-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນໃຫ້ຊາວໜຸ່ມ ແລະ ຜູ້ໃຫຍ່ທຸກຄົນສາມາດອ່ານອອກຂຽນໄດ້ ແລະ
  ຄິດໄລ່ເລກໄດ້'
4-7-title: 'ຮັບປະກັນໃຫ້ຜູ້ຮຽນທຸກຄົນໄດ້ຮັບຄວາມຮູ້ ແລະ ທັກສະທີ່ຈຳເປັນເພື່ອສົ່ງເສີມການພັດທະນາທີ່ຍືນຍົງ'
4-a-title: 'ສ້າງ ແລະ ຍົກລະດັບສະຖານທີ່ການສຶກສາທີ່ຄຳນຶງເຖິງເດັກນ້ອຍ, ຜູ້ພິການ ແລະ ບົດບາດຍິງ-ຊາຍ'
4-b-title: 'ພາຍໃນປີ 2020, ຂະຫຍາຍຈຳນວນທຶນການສຶກສາໃຫ້ແກ່ປະເທດກຳລັງພັດທະນາຢ່າງຫຼວງຫຼາຍ'
4-c-title: 'ພາຍໃນປີ 2030, ເພີ່ມຈຳນວນຄູສອນທີ່ມີຄຸນວຸດທິຢ່າງຫຼວງຫຼາຍ'
5-1-title: 'ຢຸດຕິການຈຳແນກທຸກຮູບແບບຕໍ່ແມ່ຍິງ ແລະ ເດັກຍິງໃນທຸກຫົນແຫ່ງ'
5-2-title: 'ລົບລ້າງຄວາມຮຸນແຮງທຸກຮູບແບບຕໍ່ແມ່ຍິງ ແລະ ເດັກຍິງ ທັງໃນພາກລັດ ແລະ ເອກະຊົນ'
5-3-title: 'ລົບລ້າງການປະຕິບັດທີ່ເປັນອັນຕະລາຍທຸກຮູບແບບ ເຊັ່ນ: ການແຕ່ງງານໃນໄວເດັກ ແລະ
  ການບັງຄັບແຕ່ງງານ'
5-4-title: 'ຮັບຮູ້ ແລະ ເຫັນຄຸນຄ່າຂອງວຽກເບິ່ງແຍງ ແລະ ວຽກບ້ານທີ່ບໍ່ໄດ້ຮັບຄ່າຈ້າງ'
5-5-title: 'ຮັບປະກັນການມີສ່ວນຮ່ວມຢ່າງເຕັມສ່ວນ ແລະ ມີປະສິດທິຜົນຂອງແມ່ຍິງໃນການເປັນຜູ້ນຳທຸກລະດັບ'
5-6-title: 'ຮັບປະກັນການເຂົ້າເຖິງສຸຂະພາບທາງເພດ ແລະ ສິດທິຈະເລີນພັນຢ່າງທົ່ວເຖິງ'
5-a-title: 'ດຳເນີນການປະຕິຮູບເພື່ອໃຫ້ແມ່ຍິງມີສິດເທົ່າທຽມກັນໃນຊັບພະຍາກອນທາງເສດຖະກິດ'
5-b-title: 'ເພີ່ມທະວີການນຳໃຊ້ເຕັກໂນໂລຊີ ເພື່ອສົ່ງເສີມການສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ແມ່ຍິງ'
5-c-title: 'ຮັບຮອງເອົາ ແລະ ສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ນະໂຍບາຍ ແລະ ກົດໝາຍ ເພື່ອສົ່ງເສີມຄວາມສະເໝີພາບທາງເພດ'
6-1-title: 'ພາຍໃນປີ 2030, ບັນລຸການເຂົ້າເຖິງນໍ້າດື່ມທີ່ປອດໄພ ແລະ ລາຄາບໍ່ແພງສຳລັບທຸກຄົນຢ່າງເທົ່າທຽມ'
6-2-title: 'ພາຍໃນປີ 2030, ບັນລຸການເຂົ້າເຖິງສຸຂະອະນາໄມທີ່ພຽງພໍ ແລະ ຢຸດຕິການຖ່າຍຊະຊາຍ'
6-3-title: 'ພາຍໃນປີ 2030, ປັບປຸງຄຸນນະພາບນໍ້າ ໂດຍການຫຼຸດຜ່ອນມົນລະພິດ'
6-4-title: 'ພາຍໃນປີ 2030, ເພີ່ມປະສິດທິພາບການນຳໃຊ້ນໍ້າຢ່າງຫຼວງຫຼາຍໃນທຸກຂະແໜງການ'
6-5-title: 'ພາຍໃນປີ 2030, ຈັດຕັ້ງປະຕິບັດການຄຸ້ມຄອງຊັບພະຍາກອນນໍ້າແບບປະສົມປະສານໃນທຸກລະດັບ'
6-6-title: 'ພາຍໃນປີ 2020, ປົກປ້ອງ ແລະ ຟື້ນຟູລະບົບນິເວດທີ່ກ່ຽວຂ້ອງກັບນໍ້າ'
6-a-title: 'ຂະຫຍາຍການຮ່ວມມືສາກົນ ແລະ ການສະໜັບສະໜູນການສ້າງຂີດຄວາມສາມາດດ້ານນໍ້າ ແລະ
  ສຸຂະອະນາໄມ'
6-b-title: 'ສະໜັບສະໜູນ ແລະ ສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ການມີສ່ວນຮ່ວມຂອງຊຸມຊົນທ້ອງຖິ່ນ'
7-1-title: 'ພາຍໃນປີ 2030, ຮັບປະກັນການເຂົ້າເຖິງການບໍລິການພະລັງງານທີ່ທັນສະໄໝ ແລະ ລາຄາບໍ່ແພງ'
7-2-title: 'ພາຍໃນປີ 2030, ເພີ່ມສັດສ່ວນຂອງພະລັງງານທົດແທນຢ່າງຫຼວງຫຼາຍ'
7-3-title: 'ພາຍໃນປີ 2030, ເພີ່ມອັດຕາການປັບປຸງປະສິດທິພາບການນຳໃຊ້ພະລັງງານທົ່ວໂລກໃຫ້ເປັນສອງເທົ່າ'
7-a-title: 'ເພີ່ມທະວີການຮ່ວມມືສາກົນເພື່ອອຳນວຍຄວາມສະດວກໃນການເຂົ້າເຖິງເຕັກໂນໂລຊີພະລັງງານສະອາດ'
7-b-title: 'ຂະຫຍາຍພື້ນຖານໂຄງລ່າງ ແລະ ຍົກລະດັບເຕັກໂນໂລຊີພະລັງງານໃນປະເທດກຳລັງພັດທະນາ'
8-1-title: 'ຮັກສາການເຕີບໂຕທາງເສດຖະກິດຕໍ່ຫົວຄົນໃຫ້ສອດຄ່ອງກັບສະພາບການຂອງຊາດ'
8-10-title: 'ສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ສະຖາບັນການເງິນພາຍໃນປະເທດ'
8-2-title: 'ບັນລຸລະດັບຜົນຜະລິດທາງເສດຖະກິດທີ່ສູງຂຶ້ນ'
8-3-title: 'ສົ່ງເສີມນະໂຍບາຍທີ່ສະໜັບສະໜູນການສ້າງວຽກເຮັດງານທຳທີ່ໝັ້ນຄົງ'
8-4-title: 'ປັບປຸງປະສິດທິພາບການນຳໃຊ້ຊັບພະຍາກອນທົ່ວໂລກ'
8-5-title: 'ພາຍໃນປີ 2030, ບັນລຸການຈ້າງງານທີ່ເຕັມສ່ວນ ແລະ ວຽກທີ່ມີກຽດສຳລັບທຸກຄົນ'
8-6-title: 'ພາຍໃນປີ 2020, ຫຼຸດອັດຕາສ່ວນຂອງຊາວໜຸ່ມທີ່ວ່າງງານ ຫຼື ບໍ່ໄດ້ຮັບການສຶກສາ
  ແລະ ຝຶກອົບຮົມຢ່າງຫຼວງຫຼາຍ'
8-7-title: 'ດຳເນີນມາດຕະການຢ່າງຮີບດ່ວນເພື່ອລົບລ້າງແຮງງານບັງຄັບ ແລະ ການຄ້າມະນຸດ'
8-8-title: 'ປົກປ້ອງສິດທິແຮງງານ ແລະ ສົ່ງເສີມສະພາບແວດລ້ອມການເຮັດວຽກທີ່ປອດໄພ'
8-9-title: 'ພາຍໃນປີ 2030, ວາງນະໂຍບາຍສົ່ງເສີມການທ່ອງທ່ຽວທີ່ຍືນຍົງ'
8-a-title: 'ເພີ່ມການຊ່ວຍເຫຼືອດ້ານການຄ້າສຳລັບປະເທດກຳລັງພັດທະນາ'
8-b-title: 'ພາຍໃນປີ 2020, ພັດທະນາຍຸດທະສາດທົ່ວໂລກສຳລັບການຈ້າງງານຊາວໜຸ່ມ'
9-1-title: 'ພັດທະນາພື້ນຖານໂຄງລ່າງທີ່ມີຄຸນນະພາບ, ຍືນຍົງ ແລະ ທົນທານ'
9-2-title: 'ສົ່ງເສີມການຫັນເປັນອຸດສາຫະກຳທີ່ທຸກກຸ່ມຄົນມີສ່ວນຮ່ວມ ແລະ ຍືນຍົງ'
9-3-title: 'ເພີ່ມການເຂົ້າເຖິງການບໍລິການທາງດ້ານການເງິນສຳລັບວິສາຫະກິດອຸດສາຫະກຳຂະໜາດນ້ອຍ'
9-4-title: 'ພາຍໃນປີ 2030, ຍົກລະດັບພື້ນຖານໂຄງລ່າງ ແລະ ປັບປຸງອຸດສາຫະກຳໃຫ້ມີຄວາມຍືນຍົງ'
9-5-title: 'ເພີ່ມທະວີການຄົ້ນຄວ້າທາງວິທະຍາສາດ ແລະ ຍົກລະດັບຂີດຄວາມສາມາດດ້ານເຕັກໂນໂລຊີ'
9-a-title: 'ອຳນວຍຄວາມສະດວກໃນການພັດທະນາພື້ນຖານໂຄງລ່າງທີ່ຍືນຍົງໃນປະເທດກຳລັງພັດທະນາ'
9-b-title: 'ສະໜັບສະໜູນການພັດທະນາເຕັກໂນໂລຊີ ແລະ ນະວັດຕະກຳພາຍໃນປະເທດ'
9-c-title: 'ເພີ່ມການເຂົ້າເຖິງເຕັກໂນໂລຊີຂໍ້ມູນຂ່າວສານ ແລະ ການສື່ສານຢ່າງຫຼວງຫຼາຍ'

1-short: 'ຍຸດຕິຄວາມທຸກຍາກ'
1-title: 'ຍຸດຕິຄວາມທຸກຍາກໃນທຸກຮູບແບບຢູ່ໃນທຸກຫົນແຫ່ງ'
10-short: 'ຫຼຸດຜ່ອນຄວາມບໍ່ສະເໝີພາບ'
10-title: 'ຫຼຸດຜ່ອນຄວາມບໍ່ສະເໝີພາບພາຍໃນ ແລະ ລະຫວ່າງປະເທດ'
11-short: 'ສ້າງຕົວເມືອງ ແລະ ຊຸມຊົນທີ່ຍືນຍົງ'
11-title: 'ເຮັດໃຫ້ຕົວເມືອງ ແລະ ການຕັ້ງຖິ່ນຖານຂອງມະນຸດມີຄວາມປອດໄພ, ມີຄວາມສາມາດໃນການປັບຕົວ
  ແລະ ຍືນຍົງ ໂດຍທຸກຄົນມີສ່ວນຮ່ວມ'
12-short: 'ການບໍລິໂພກ ແລະ ການຜະລິດທີ່ມີຄວາມຮັບຜິດຊອບ'
12-title: 'ຮັບປະກັນແບບແຜນການບໍລິໂພກ ແລະ ການຜະລິດທີ່ຍືນຍົງ'
13-short: 'ການຮັບມືກັບການປ່ຽນແປງສະພາບພູມອາກາດ'
13-title: 'ດຳເນີນການຢ່າງຮີບດ່ວນເພື່ອຮັບມືກັບການປ່ຽນແປງສະພາບພູມອາກາດ ແລະ ຜົນກະທົບທີ່ເກີດຂຶ້ນ'
14-short: 'ລະບົບນິເວດທາງທະເລ ແລະ ມະຫາສະໝຸດ'
14-title: 'ອະນຸລັກ ແລະ ນຳໃຊ້ມະຫາສະໝຸດ, ທະເລ ແລະ ຊັບພະຍາກອນທາງທະເລຢ່າງຍືນຍົງເພື່ອການພັດທະນາທີ່ຍືນຍົງ'
15-short: 'ລະບົບນິເວດທາງບົກ'
15-title: 'ປົກປັກຮັກສາ, ຟື້ນຟູ ແລະ ສົ່ງເສີມການນຳໃຊ້ລະບົບນິເວດທາງບົກຢ່າງຍືນຍົງ, ການຄຸ້ມຄອງປ່າໄມ້ຢ່າງຍືນຍົງ,
  ຕ້ານການກາຍເປັນທະເລຊາຍ, ຢຸດຕິ ແລະ ຟື້ນຟູການເຊື່ອມໂຊມຂອງດິນ ແລະ ຢຸດຕິການສູນເສຍຊີວະນາໆພັນ'
16-short: 'ສັນຕິພາບ, ຄວາມຍຸດຕິທຳ ແລະ ສະຖາບັນທີ່ເຂັ້ມແຂງ'
16-title: 'ສົ່ງເສີມສັງຄົມທີ່ສະຫງົບສຸກ ແລະ ມີສ່ວນຮ່ວມເພື່ອການພັດທະນາທີ່ຍືນຍົງ, ສ້າງຄວາມສະດວກໃນການເຂົ້າເຖິງຄວາມຍຸດຕິທຳສຳລັບທຸກຄົນ
  ແລະ ສ້າງສະຖາບັນທີ່ມີປະສິດທິພາບ, ມີຄວາມຮັບຜິດຊອບ ແລະ ມີສ່ວນຮ່ວມໃນທຸກລະດັບ'
17-short: 'ການຮ່ວມມືເພື່ອເປົ້າໝາຍການພັດທະນາທີ່ຍືນຍົງ'
17-title: 'ສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ວິທີການຈັດຕັ້ງປະຕິບັດ ແລະ ຟື້ນຟູການເປັນຄູ່ຮ່ວມມືລະດັບສາກົນເພື່ອການພັດທະນາທີ່ຍືນຍົງ'
2-short: 'ຍຸດຕິຄວາມອຶດຫິວ'
2-title: 'ຍຸດຕິຄວາມອຶດຫິວ, ບັນລຸຄວາມໝັ້ນຄົງທາງດ້ານສະບຽງອາຫານ, ປັບປຸງໂພຊະນາການ ແລະ
  ສົ່ງເສີມກະສິກຳທີ່ຍືນຍົງ'
3-short: 'ການມີສຸຂະພາບ ແລະ ສະຫວັດດີການທີ່ດີ'
3-title: 'ຮັບປະກັນການມີສຸຂະພາບທີ່ດີ ແລະ ສົ່ງເສີມສະຫວັດດີການສຳລັບທຸກຄົນໃນທຸກໄວ'
4-short: 'ການສຶກສາທີ່ມີຄຸນນະພາບ'
4-title: 'ຮັບປະກັນການສຶກສາທີ່ມີຄຸນນະພາບຢ່າງທົ່ວເຖິງ ແລະ ເທົ່າທຽມ ແລະ ສົ່ງເສີມໂອກາດໃນການຮຽນຮູ້ຕະຫຼອດຊີວິດສຳລັບທຸກຄົນ'
5-short: 'ຄວາມສະເໝີພາບທາງເພດ'
5-title: 'ບັນລຸຄວາມສະເໝີພາບທາງເພດ ແລະ ສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ແມ່ຍິງ ແລະ ເດັກຍິງທຸກຄົນ'
6-short: 'ນ້ຳສະອາດ ແລະ ສຸຂາພິບານ'
6-title: 'ຮັບປະກັນການມີນ້ຳໃຊ້ ແລະ ການຄຸ້ມຄອງນ້ຳ ແລະ ສຸຂາພິບານຢ່າງຍືນຍົງສຳລັບທຸກຄົນ'
7-short: 'ພະລັງງານສະອາດທີ່ທຸກຄົນເຂົ້າເຖິງໄດ້'
7-title: 'ຮັບປະກັນການເຂົ້າເຖິງພະລັງງານທີ່ທັນສະໄໝ, ເຊື່ອຖືໄດ້, ຍືນຍົງ ແລະ ໃນລາຄາທີ່ເໝາະສົມສຳລັບທຸກຄົນ'
8-short: 'ວຽກງານທີ່ມີຄຸນຄ່າ ແລະ ການເຕີບໂຕທາງເສດຖະກິດ'
8-title: 'ສົ່ງເສີມການເຕີບໂຕທາງເສດຖະກິດທີ່ຕໍ່ເນື່ອງ, ທົ່ວເຖິງ ແລະ ຍືນຍົງ, ການຈ້າງງານທີ່ມີປະສິດທິພາບ
  ແລະ ວຽກງານທີ່ມີຄຸນຄ່າສຳລັບທຸກຄົນ'
9-short: 'ອຸດສາຫະກຳ, ນະວັດຕະກຳ ແລະ ໂຄງລ່າງພື້ນຖານ'
9-title: 'ສ້າງໂຄງລ່າງພື້ນຖານທີ່ມີຄວາມທົນທານ, ສົ່ງເສີມການຫັນເປັນອຸດສາຫະກຳທີ່ທົ່ວເຖິງ
  ແລະ ຍືນຍົງ ແລະ ສົ່ງເສີມນະວັດຕະກຳ'

intro_body: <a 
  href="https://www.un.org/sustainabledevelopment/sustainable-development-goals/">ເປົ້າໝາຍການພັດທະນາແບບຍືນຍົງ
  (SDGs)</a> ແມ່ນການຮຽກຮ້ອງໃຫ້ທົ່ວໂລກຮ່ວມມືກັນຈັດຕັ້ງປະຕິບັດ 
  ເພື່ອຢຸດຕິຄວາມທຸກຍາກ, ປົກປັກຮັກສາໂລກ ແລະ ປັບປຸງຊີວິດການເປັນຢູ່ 
  ລວມທັງອະນາຄົດຂອງທຸກໆຄົນໃນທຸກຫົນແຫ່ງ. ທັງ 17 ເປົ້າໝາຍ 
  ແມ່ນໄດ້ຮັບການຮັບຮອງໂດຍບັນດາປະເທດສະມາຊິກອົງການສະຫະປະຊາຊາດທັງໝົດໃນປີ 2015, 
  ເຊິ່ງເປັນສ່ວນໜຶ່ງຂອງ <a 
  href="https://sdgs.un.org/2030agenda">ວາລະການພັດທະນາແບບຍືນຍົງ ປີ 2030</a>.

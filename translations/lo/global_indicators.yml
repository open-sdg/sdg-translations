1-1-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ອາໄສຢູ່ໃຕ້ເສັ້ນຄວາມທຸກຍາກສາກົນ ແຍກຕາມເພດ, ອາຍຸ,
  ສະຖານະພາບການຈ້າງງານ ແລະ ທີ່ຕັ້ງພູມສັນຖານ (ຕົວເມືອງ/ຊົນນະບົດ)'
1-2-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ອາໄສຢູ່ໃຕ້ເສັ້ນຄວາມທຸກຍາກແຫ່ງຊາດ ແຍກຕາມເພດ ແລະ ອາຍຸ'
1-2-2-title: 'ສັດສ່ວນຂອງເພດຊາຍ, ເພດຍິງ ແລະ ເດັກນ້ອຍທຸກເກນອາຍຸ ທີ່ອາໄສຢູ່ໃນຄວາມທຸກຍາກໃນທຸກມິຕິ
  ຕາມການກຳນົດຂອງຊາດ'
1-3-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ໄດ້ຮັບການຄຸ້ມຄອງໂດຍລະບົບ/ພື້ນຖານການປົກປ້ອງທາງສັງຄົມ
  ແຍກຕາມເພດ, ເດັກນ້ອຍ, ຜູ້ວ່າງງານ, ຜູ້ສູງອາຍຸ, ຄົນພິການ, ແມ່ຍິງຖືພາ, ເດັກເກີດໃໝ່,
  ຜູ້ຖືກເຄາະຮ້າຍຈາກການບາດເຈັບໃນການເຮັດວຽກ, ຜູ້ທຸກຍາກ ແລະ ຜູ້ດ້ອຍໂອກາດ'
1-4-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ອາໄສຢູ່ໃນຄົວເຮືອນທີ່ມີການເຂົ້າເຖິງການບໍລິການຂັ້ນພື້ນຖານ'
1-4-2-title: 'ສັດສ່ວນຂອງປະຊາກອນຜູ້ໃຫຍ່ທັງໝົດທີ່ມີສິດຄອບຄອງທີ່ດິນຢ່າງປອດໄພ, (ກ) ມີເອກະສານຢັ້ງຢືນທີ່ຖືກຕ້ອງຕາມກົດໝາຍ,
  ແລະ (ຂ) ຜູ້ທີ່ຮັບຮູ້ວ່າສິດຄອບຄອງທີ່ດິນຂອງຕົນມີຄວາມປອດໄພ, ແຍກຕາມເພດ ແລະ ປະເພດການຄອບຄອງ'
1-5-1-title: 'ຈຳນວນຜູ້ເສຍຊີວິດ, ຜູ້ສູນຫາຍ ແລະ ຜູ້ທີ່ໄດ້ຮັບຜົນກະທົບໂດຍກົງຈາກໄພພິບັດ
  ຕໍ່ປະຊາກອນ 100,000 ຄົນ'
1-5-2-title: 'ການສູນເສຍທາງດ້ານເສດຖະກິດໂດຍກົງຈາກໄພພິບັດ ທຽບໃສ່ຜະລິດຕະພັນພາຍໃນລວມ (GDP)
  ທົ່ວໂລກ'
1-5-3-title: 'ຈຳນວນປະເທດທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດແຫ່ງຊາດ
  ທີ່ສອດຄ່ອງກັບຂອບວຽກ Sendai ສຳລັບການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດ ປີ 2015-2030'
1-5-4-title: 'ສັດສ່ວນຂອງອົງການປົກຄອງທ້ອງຖິ່ນທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດທ້ອງຖິ່ນ
  ທີ່ສອດຄ່ອງກັບຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດແຫ່ງຊາດ'
1-a-1-title: 'ຈຳນວນເງິນຊ່ວຍເຫຼືອລ້າທັງໝົດເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ທີ່ເນັ້ນໃສ່ການຫຼຸດຜ່ອນຄວາມທຸກຍາກ
  ຄິດເປັນສັດສ່ວນຂອງລາຍໄດ້ແຫ່ງຊາດລວມຂອງປະເທດຜູ້ຮັບ'
1-a-2-title: 'ສັດສ່ວນການໃຊ້ຈ່າຍທັງໝົດຂອງລັດຖະບານໃນການບໍລິການທີ່ຈຳເປັນ (ການສຶກສາ, ສາທາລະນະສຸກ
  ແລະ ການປົກປ້ອງທາງສັງຄົມ)'
1-a-3-title: 'ຜົນລວມຂອງເງິນຊ່ວຍເຫຼືອລ້າທັງໝົດ ແລະ ກະແສເງິນຂາເຂົ້າທີ່ບໍ່ສ້າງໜີ້ ທີ່ຖືກຈັດສັນໂດຍກົງໃຫ້ແກ່ແຜນງານການຫຼຸດຜ່ອນຄວາມທຸກຍາກ
  ຄິດເປັນສັດສ່ວນຂອງ GDP'
1-b-1-title: 'ການໃຊ້ຈ່າຍທາງສັງຄົມຂອງພາກລັດທີ່ເອື້ອອໍານວຍຕໍ່ຜູ້ທຸກຍາກ'
10-1-1-title: 'ອັດຕາການເຕີບໂຕຂອງການໃຊ້ຈ່າຍ ຫຼື ລາຍໄດ້ຂອງຄົວເຮືອນຕໍ່ຫົວຄົນ ໃນກຸ່ມປະຊາກອນທີ່ມີລາຍໄດ້ຕໍ່າສຸດ
  40% ແລະ ປະຊາກອນທັງໝົດ'
10-2-1-title: 'ສັດສ່ວນຂອງປະຊາຊົນທີ່ອາໄສຢູ່ຕໍ່າກວ່າ 50% ຂອງລາຍໄດ້ປານກາງ, ແຍກຕາມເພດ,
  ອາຍຸ ແລະ ຄົນພິການ'
10-3-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ລາຍງານວ່າຕົນເອງເຄີຍຖືກເລືອກປະຕິບັດ ຫຼື ຖືກຄຸກຄາມ
  ໃນໄລຍະ 12 ເດືອນຜ່ານມາ ບົນພື້ນຖານການເລືອກປະຕິບັດທີ່ຖືກຫ້າມພາຍໃຕ້ກົດໝາຍສິດທິມະນຸດສາກົນ'
10-4-1-title: 'ສັດສ່ວນຂອງລາຍໄດ້ແຮງງານໃນ GDP'
10-5-1-title: 'ຕົວຊີ້ວັດຄວາມໝັ້ນຄົງທາງດ້ານການເງິນ'
10-6-1-title: 'ສັດສ່ວນຂອງສະມາຊິກ ແລະ ສິດໃນການລົງຄະແນນສຽງຂອງປະເທດກຳລັງພັດທະນາ ໃນອົງການຈັດຕັ້ງສາກົນ'
10-7-1-title: 'ຄ່າໃຊ້ຈ່າຍໃນການຈັດຫາງານທີ່ລູກຈ້າງຮັບຜິດຊອບ ຄິດເປັນສັດສ່ວນຂອງລາຍໄດ້ປະຈຳເດືອນທີ່ໄດ້ຮັບໃນປະເທດປາຍທາງ'
10-7-2-title: 'ຈຳນວນປະເທດທີ່ມີນະໂຍບາຍການຍ້າຍຖິ່ນຖານທີ່ອຳນວຍຄວາມສະດວກໃຫ້ແກ່ການຍ້າຍຖິ່ນຖານທີ່ເປັນລະບຽບ,
  ປອດໄພ, ຖືກຕ້ອງ ແລະ ມີຄວາມຮັບຜິດຊອບ'
10-a-1-title: 'ສັດສ່ວນຂອງລາຍການພາສີທີ່ນຳໃຊ້ກັບການນຳເຂົ້າຈາກປະເທດດ້ອຍພັດທະນາ ແລະ ປະເທດກຳລັງພັດທະນາ
  ທີ່ມີອັດຕາພາສີ 0%'
10-b-1-title: 'ກະແສຊັບພະຍາກອນທັງໝົດເພື່ອການພັດທະນາ (ເຊັ່ນ: ການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ,
  ການລົງທຶນໂດຍກົງຈາກຕ່າງປະເທດ ແລະ ກະແສເງິນອື່ນໆ)'
10-c-1-title: 'ຄ່າໃຊ້ຈ່າຍໃນການໂອນເງິນ ຄິດເປັນສັດສ່ວນຂອງຈຳນວນເງິນທີ່ໂອນ'
11-1-1-title: 'ສັດສ່ວນຂອງປະຊາກອນຕົວເມືອງທີ່ອາໄສຢູ່ໃນເຂດແອອັດ, ການຕັ້ງຖິ່ນຖານທີ່ບໍ່ເປັນລະບົບ
  ຫຼື ທີ່ຢູ່ອາໄສທີ່ບໍ່ເໝາະສົມ'
11-2-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ສາມາດເຂົ້າເຖິງການບໍລິການຂົນສົ່ງສາທາລະນະໄດ້ໂດຍສະດວກ,
  ແຍກຕາມເພດ, ອາຍຸ ແລະ ຄົນພິການ'
11-3-1-title: 'ອັດຕາສ່ວນລະຫວ່າງອັດຕາການນຳໃຊ້ທີ່ດິນ ຕໍ່ ອັດຕາການເຕີບໂຕຂອງປະຊາກອນ'
11-3-2-title: 'ສັດສ່ວນຂອງຕົວເມືອງທີ່ມີໂຄງສ້າງການມີສ່ວນຮ່ວມໂດຍກົງຂອງພາກປະຊາສັງຄົມ ໃນການວາງແຜນ
  ແລະ ຄຸ້ມຄອງຕົວເມືອງ ທີ່ດຳເນີນງານຢ່າງເປັນປົກກະຕິ ແລະ ຕາມຫຼັກປະຊາທິປະໄຕ'
11-4-1-title: 'ລາຍຈ່າຍທັງໝົດຕໍ່ຫົວຄົນໃນການປົກປັກຮັກສາ ແລະ ອະນຸລັກມໍລະດົກທາງວັດທະນະທຳ
  ແລະ ທຳມະຊາດທັງໝົດ, ແຍກຕາມແຫຼ່ງທຶນ (ພາກລັດ, ເອກະຊົນ), ປະເພດມໍລະດົກ (ວັດທະນະທຳ, ທຳມະຊາດ)
  ແລະ ລະດັບການປົກຄອງ (ລະດັບຊາດ, ພາກພື້ນ ແລະ ທ້ອງຖິ່ນ/ເທດສະບານ)'
11-5-1-title: 'ຈຳນວນຜູ້ເສຍຊີວິດ, ຜູ້ສູນຫາຍ ແລະ ຜູ້ທີ່ໄດ້ຮັບຜົນກະທົບໂດຍກົງຈາກໄພພິບັດ
  ຕໍ່ປະຊາກອນ 100,000 ຄົນ'
11-5-2-title: 'ການສູນເສຍທາງດ້ານເສດຖະກິດໂດຍກົງຈາກໄພພິບັດ ທຽບໃສ່ຜະລິດຕະພັນພາຍໃນລວມ (GDP)
  ທົ່ວໂລກ'
11-6-1-title: 'ສັດສ່ວນຂອງຂີ້ເຫຍື້ອແຂງໃນຕົວເມືອງທີ່ຖືກເກັບມ້ຽນ ແລະ ຄຸ້ມຄອງໃນສະຖານທີ່ທີ່ໄດ້ຮັບການຄວບຄຸມ
  ທຽບໃສ່ປະລິມານຂີ້ເຫຍື້ອໃນຕົວເມືອງທັງໝົດທີ່ເກີດຂຶ້ນ, ແຍກຕາມຕົວເມືອງ'
11-6-2-title: 'ລະດັບສະເລ່ຍປະຈຳປີຂອງຝຸ່ນລະອອງຂະໜາດນ້ອຍ (ເຊັ່ນ: PM2.5 ແລະ PM10) ໃນຕົວເມືອງ
  (ຖ່ວງນ້ຳໜັກຕາມຈຳນວນປະຊາກອນ)'
11-7-1-title: 'ສັດສ່ວນສະເລ່ຍຂອງພື້ນທີ່ປຸກສ້າງໃນຕົວເມືອງທີ່ເປັນພື້ນທີ່ເປີດແປນເພື່ອການຊົມໃຊ້ສາທາລະນະສຳລັບທຸກຄົນ,
  ແຍກຕາມເພດ, ອາຍຸ ແລະ ຄົນພິການ'
11-7-2-title: 'ສັດສ່ວນຂອງຜູ້ທີ່ຕົກເປັນເຫຍື່ອຂອງການຄຸກຄາມທາງເພດ ຫຼື ບໍ່ແມ່ນທາງເພດ,
  ແຍກຕາມເພດ, ອາຍຸ, ສະຖານະພາບຄວາມພິການ ແລະ ສະຖານທີ່ເກີດເຫດ, ໃນໄລຍະ 12 ເດືອນຜ່ານມາ'
11-a-1-title: 'ຈຳນວນປະເທດທີ່ມີນະໂຍບາຍຕົວເມືອງແຫ່ງຊາດ ຫຼື ແຜນພັດທະນາພາກພື້ນທີ່ (ກ)
  ຕອບສະໜອງຕໍ່ການປ່ຽນແປງຂອງປະຊາກອນ; (ຂ) ຮັບປະກັນການພັດທະນາພື້ນທີ່ຢ່າງສົມດຸນ; ແລະ (ຄ)
  ເພີ່ມທະວີຊ່ອງທາງດ້ານການເງິນຂອງທ້ອງຖິ່ນ'
11-b-1-title: 'ຈຳນວນປະເທດທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດແຫ່ງຊາດ
  ທີ່ສອດຄ່ອງກັບຂອບວຽກ Sendai ສຳລັບການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດ ປີ 2015-2030'
11-b-2-title: 'ສັດສ່ວນຂອງອົງການປົກຄອງທ້ອງຖິ່ນທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດທ້ອງຖິ່ນ
  ທີ່ສອດຄ່ອງກັບຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດແຫ່ງຊາດ'
11-c-1-title: 'ຈຳນວນເງິນຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການທັງໝົດ ແລະ ກະແສເງິນທາງການອື່ນໆ
  ທີ່ສະໜັບສະໜູນ ໂຄງລ່າງພື້ນຖານຕົວເມືອງ ຫຼື ໂຄງການໂຄງລ່າງພື້ນຖານຕົວເມືອງ, ແຍກຕາມຂະແໜງການ'
12-1-1-title: 'ຈຳນວນປະເທດທີ່ພວມພັດທະນາ, ຮັບຮອງ ຫຼື ຈັດຕັ້ງປະຕິບັດເຄື່ອງມືທາງນະໂຍບາຍ
  ທີ່ແນໃສ່ສະໜັບສະໜູນ ການປ່ຽນແປງໄປສູ່ການບໍລິໂພກ ແລະ ການຜະລິດທີ່ຍືນຍົງ'
12-2-1-title: 'ຮ່ອງຮອຍການນຳໃຊ້ວັດສະດຸ, ຮ່ອງຮອຍການນຳໃຊ້ວັດສະດຸຕໍ່ຫົວຄົນ, ແລະ ຮ່ອງຮອຍການນຳໃຊ້ວັດສະດຸຕໍ່
  GDP'
12-2-2-title: 'ການບໍລິໂພກວັດສະດຸພາຍໃນປະເທດ, ການບໍລິໂພກວັດສະດຸພາຍໃນປະເທດຕໍ່ຫົວຄົນ,
  ແລະ ການບໍລິໂພກວັດສະດຸພາຍໃນປະເທດຕໍ່ GDP'
12-3-1-title: '(ກ) ດັດຊະນີການສູນເສຍອາຫານ ແລະ (ຂ) ດັດຊະນີຂີ້ເຫຍື້ອອາຫານ'
12-4-1-title: 'ຈຳນວນພາຄີຂອງຂໍ້ຕົກລົງສິ່ງແວດລ້ອມຫຼາຍຝ່າຍສາກົນ ກ່ຽວກັບສິ່ງເສດເຫຼືອອັນຕະລາຍ
  ແລະ ສານເຄມີອື່ນໆ ທີ່ປະຕິບັດຕາມພັນທະ ແລະ ຂໍ້ຜູກພັນໃນການສົ່ງຂໍ້ມູນຕາມທີ່ກຳນົດໄວ້ໃນແຕ່ລະຂໍ້ຕົກລົງທີ່ກ່ຽວຂ້ອງ'
12-4-2-title: '(ກ) ປະລິມານສິ່ງເສດເຫຼືອອັນຕະລາຍທີ່ເກີດຂຶ້ນຕໍ່ຫົວຄົນ; ແລະ (ຂ) ສັດສ່ວນຂອງສິ່ງເສດເຫຼືອອັນຕະລາຍທີ່ໄດ້ຮັບການບຳບັດ,
  ແຍກຕາມປະເພດການບຳບັດ'
12-5-1-title: 'ອັດຕາການນຳວັດສະດຸມາໃຊ້ຄືນໃໝ່ລະດັບຊາດ, ປະລິມານວັດສະດຸທີ່ນຳມາໃຊ້ຄືນໃໝ່ເປັນໂຕນ'
12-6-1-title: 'ຈຳນວນບໍລິສັດທີ່ເຜີຍແຜ່ບົດລາຍງານຄວາມຍືນຍົງ'
12-7-1-title: 'ຈຳນວນປະເທດທີ່ຈັດຕັ້ງປະຕິບັດນະໂຍບາຍ ແລະ ແຜນປະຕິບັດງານການຈັດຊື້-ຈັດຈ້າງພາກລັດທີ່ຍືນຍົງ'
12-8-1-title: 'ຂອບເຂດທີ່ (i) ການສຶກສາຄວາມເປັນພົນລະເມືອງໂລກ ແລະ (ii) ການສຶກສາເພື່ອການພັດທະນາທີ່ຍືນຍົງ
  ຖືກລວມເຂົ້າໃນ (ກ) ນະໂຍບາຍການສຶກສາແຫ່ງຊາດ; (ຂ) ຫຼັກສູດການສອນ; (ຄ) ການສຶກສາຂອງຄູ;
  ແລະ (ງ) ການປະເມີນນັກຮຽນ'
12-a-1-title: 'ກຳລັງການຜະລິດພະລັງງານທົດແທນທີ່ຕິດຕັ້ງໃນປະເທດກຳລັງພັດທະນາ ແລະ ປະເທດພັດທະນາແລ້ວ
  (ເປັນວັດຕໍ່ຫົວຄົນ)'
12-b-1-title: 'ການຈັດຕັ້ງປະຕິບັດເຄື່ອງມືການບັນຊີມາດຕະຖານ ເພື່ອຕິດຕາມກວດກາດ້ານເສດຖະກິດ
  ແລະ ສິ່ງແວດລ້ອມ ຂອງຄວາມຍືນຍົງດ້ານການທ່ອງທ່ຽວ'
12-c-1-title: 'ຈຳນວນເງິນອຸດໜູນເຊື້ອໄຟຟອດຊິວ (ການຜະລິດ ແລະ ການບໍລິໂພກ) ຕໍ່ຫົວໜ່ວຍ GDP'
13-1-1-title: 'ຈຳນວນຜູ້ເສຍຊີວິດ, ຜູ້ສູນຫາຍ ແລະ ຜູ້ທີ່ໄດ້ຮັບຜົນກະທົບໂດຍກົງຈາກໄພພິບັດ
  ຕໍ່ປະຊາກອນ 100,000 ຄົນ'
13-1-2-title: 'ຈຳນວນປະເທດທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດແຫ່ງຊາດ
  ທີ່ສອດຄ່ອງກັບຂອບວຽກ Sendai ສຳລັບການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດ ປີ 2015-2030'
13-1-3-title: 'ສັດສ່ວນຂອງອົງການປົກຄອງທ້ອງຖິ່ນທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດທ້ອງຖິ່ນ
  ທີ່ສອດຄ່ອງກັບຍຸດທະສາດການຫຼຸດຜ່ອນຄວາມສ່ຽງໄພພິບັດແຫ່ງຊາດ'
13-2-1-title: 'ຈຳນວນປະເທດທີ່ມີການປະກອບສ່ວນທີ່ກຳນົດເອງໃນລະດັບຊາດ (NDCs), ຍຸດທະສາດໄລຍະຍາວ,
  ແຜນການປັບຕົວແຫ່ງຊາດ ແລະ ການສື່ສານດ້ານການປັບຕົວ ຕາມທີ່ໄດ້ລາຍງານຕໍ່ກອງເລຂາສົນທິສັນຍາຂອບສະຫະປະຊາຊາດ
  ວ່າດ້ວຍການປ່ຽນແປງດິນຟ້າອາກາດ'
13-3-1-title: 'ຂອບເຂດທີ່ (i) ການສຶກສາຄວາມເປັນພົນລະເມືອງໂລກ ແລະ (ii) ການສຶກສາເພື່ອການພັດທະນາທີ່ຍືນຍົງ
  ຖືກລວມເຂົ້າໃນ (ກ) ນະໂຍບາຍການສຶກສາແຫ່ງຊາດ; (ຂ) ຫຼັກສູດການສອນ; (ຄ) ການສຶກສາຂອງຄູ;
  ແລະ (ງ) ການປະເມີນນັກຮຽນ'
13-3-2-title: 'ຈຳນວນປະເທດທີ່ໄດ້ລາຍງານເຖິງການສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ຂີດຄວາມສາມາດດ້ານສະຖາບັນ,
  ລະບົບ ແລະ ບຸກຄົນ ເພື່ອຈັດຕັ້ງປະຕິບັດການປັບຕົວ, ການຫຼຸດຜ່ອນຜົນກະທົບ, ການຖ່າຍທອດເຕັກໂນໂລຢີ
  ແລະ ການພັດທະນາ'
13-a-1-title: 'ຈຳນວນເງິນທີ່ໄດ້ຮັບການສະໜອງ ແລະ ລະດົມເປັນໂດລາສະຫະລັດຕໍ່ປີ ທີ່ກ່ຽວຂ້ອງກັບເປົ້າໝາຍການລະດົມຮ່ວມກັນ
  1 ແສນລ້ານໂດລາ ທີ່ມີຢູ່ຕໍ່ເນື່ອງຈົນເຖິງປີ 2025'
13-b-1-title: 'ຈຳນວນປະເທດດ້ອຍພັດທະນາ ແລະ ປະເທດກຳລັງພັດທະນາທີ່ເປັນເກາະນ້ອຍ ທີ່ມີການປະກອບສ່ວນທີ່ກຳນົດເອງໃນລະດັບຊາດ
  (NDCs), ຍຸດທະສາດໄລຍະຍາວ, ແຜນການປັບຕົວແຫ່ງຊາດ ແລະ ການສື່ສານດ້ານການປັບຕົວ ຕາມທີ່ລາຍງານຕໍ່ກອງເລຂາ
  UNFCCC'
14-1-1-title: '(ກ) ດັດຊະນີການເພີ່ມຂຶ້ນຂອງທາດບຳລຸງໃນເຂດຊາຍຝັ່ງ; ແລະ (ຂ) ຄວາມໜາແໜ້ນຂອງເສດຢາງພາລາສຕິກ'
14-2-1-title: 'ຈຳນວນປະເທດທີ່ນຳໃຊ້ວິທີການທີ່ອີງໃສ່ລະບົບນິເວດ ໃນການຄຸ້ມຄອງເຂດທະເລ'
14-3-1-title: 'ຄ່າຄວາມເປັນກົດສະເລ່ຍຂອງນ້ຳທະເລ (pH) ທີ່ວັດແທກຢູ່ສະຖານີເກັບຕົວຢ່າງຕົວແທນທີ່ໄດ້ຕົກລົງກັນ'
14-4-1-title: 'ສັດສ່ວນຂອງປະລິມານສັດນ້ຳພາຍໃນລະດັບທີ່ຍືນຍົງທາງຊີວະພາບ'
14-5-1-title: 'ເນື້ອທີ່ການຄຸ້ມຄອງເຂດປ່າສະຫງວນທີ່ກ່ຽວຂ້ອງກັບເຂດທະເລ'
14-6-1-title: 'ລະດັບການຈັດຕັ້ງປະຕິບັດເຄື່ອງມືສາກົນ ທີ່ແນໃສ່ການຕ້ານການຫາປາທີ່ຜິດກົດໝາຍ,
  ບໍ່ມີການລາຍງານ ແລະ ບໍ່ມີການຄວບຄຸມ'
14-7-1-title: 'ມູນຄ່າການປະມົງທີ່ຍືນຍົງ ຄິດເປັນສັດສ່ວນຂອງ GDP ໃນປະເທດກຳລັງພັດທະນາທີ່ເປັນເກາະນ້ອຍ,
  ປະເທດດ້ອຍພັດທະນາ ແລະ ທຸກປະເທດ'
14-a-1-title: 'ສັດສ່ວນຂອງງົບປະມານການຄົ້ນຄວ້າທັງໝົດ ທີ່ຈັດສັນໃຫ້ແກ່ການຄົ້ນຄວ້າໃນຂະແໜງເຕັກໂນໂລຢີທາງທະເລ'
14-b-1-title: 'ລະດັບການນຳໃຊ້ຂອບວຽກດ້ານກົດໝາຍ/ລະບຽບການ/ນະໂຍບາຍ/ສະຖາບັນ ທີ່ຮັບຮູ້ ແລະ
  ປົກປ້ອງສິດໃນການເຂົ້າເຖິງສຳລັບການປະມົງຂະໜາດນ້ອຍ'
14-c-1-title: 'ຈຳນວນປະເທດທີ່ມີຄວາມຄືບໜ້າໃນການໃຫ້ສັດຕະຍາບັນ, ການຍອມຮັບ ແລະ ການຈັດຕັ້ງປະຕິບັດເຄື່ອງມືທີ່ກ່ຽວຂ້ອງກັບມະຫາສະໝຸດ
  ຜ່ານຂອບວຽກດ້ານກົດໝາຍ, ນະໂຍບາຍ ແລະ ສະຖາບັນ ຕາມກົດໝາຍສາກົນ (UNCLOS) ເພື່ອການອະນຸລັກ
  ແລະ ການນຳໃຊ້ມະຫາສະໝຸດ ແລະ ຊັບພະຍາກອນຢ່າງຍືນຍົງ'
15-1-1-title: 'ເນື້ອທີ່ປ່າໄມ້ ຄິດເປັນສັດສ່ວນຂອງເນື້ອທີ່ດິນທັງໝົດ'
15-1-2-title: 'ສັດສ່ວນຂອງສະຖານທີ່ສຳຄັນສຳລັບຊີວະນາໆພັນທາງບົກ ແລະ ນ້ຳຈືດ ທີ່ຖືກປົກຄຸມໂດຍເຂດປ່າສະຫງວນ,
  ແຍກຕາມປະເພດລະບົບນິເວດ'
15-2-1-title: 'ຄວາມຄືບໜ້າໄປສູ່ການຄຸ້ມຄອງປ່າໄມ້ຢ່າງຍືນຍົງ'
15-3-1-title: 'ສັດສ່ວນຂອງເນື້ອທີ່ດິນທີ່ເສື່ອມໂຊມ ຕໍ່ເນື້ອທີ່ດິນທັງໝົດ'
15-4-1-title: 'ເນື້ອທີ່ການຄຸ້ມຄອງໂດຍເຂດປ່າສະຫງວນ ຂອງສະຖານທີ່ສຳຄັນສຳລັບຊີວະນາໆພັນໃນເຂດພູດອຍ'
15-4-2-title: '(ກ) ດັດຊະນີພື້ນທີ່ສີຂຽວໃນເຂດພູດອຍ ແລະ (ຂ) ສັດສ່ວນຂອງດິນພູດອຍທີ່ເສື່ອມໂຊມ'
15-5-1-title: 'ດັດຊະນີບັນຊີແດງ (Red List Index)'
15-6-1-title: 'ຈຳນວນປະເທດທີ່ໄດ້ຮັບຮອງຂອບວຽກດ້ານນິຕິບັນຍັດ, ການບໍລິຫານ ແລະ ນະໂຍບາຍ
  ເພື່ອຮັບປະກັນການແບ່ງປັນຜົນປະໂຫຍດຢ່າງຍຸດຕິທຳ ແລະ ສະເໝີພາບ'
15-7-1-title: 'ສັດສ່ວນຂອງສັດປ່າທີ່ຖືກຄ້າຂາຍ ເຊິ່ງມາຈາກການລັກລອບລ່າ ຫຼື ການຄ້າຂາຍທີ່ຜິດກົດໝາຍ'
15-8-1-title: 'ສັດສ່ວນຂອງປະເທດທີ່ຮັບຮອງເອົານິຕິກຳແຫ່ງຊາດທີ່ກ່ຽວຂ້ອງ ແລະ ຈັດສັນຊັບພະຍາກອນຢ່າງພຽງພໍ
  ໃນການປ້ອງກັນ ຫຼື ຄວບຄຸມຊະນິດພັນຕ່າງຖິ່ນທີ່ຮຸກຮານ'
15-9-1-title: '(ກ) ຈຳນວນປະເທດທີ່ໄດ້ກຳນົດເປົ້າໝາຍແຫ່ງຊາດ ໃຫ້ສອດຄ່ອງ ຫຼື ຄ້າຍຄືກັບເປົ້າໝາຍທີ
  14 ຂອງຂອບຊີວະນາໆພັນໂລກ Kunming-Montreal ແລະ ຄວາມຄືບໜ້າທີ່ລາຍງານ; ແລະ (ຂ) ການເຊື່ອມໂຍງຊີວະນາໆພັນເຂົ້າໃນລະບົບບັນຊີ
  ແລະ ການລາຍງານແຫ່ງຊາດ (SEEA)'
15-a-1-title: '(ກ) ການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ໃນການອະນຸລັກ ແລະ ການນຳໃຊ້ຊີວະນາໆພັນຢ່າງຍືນຍົງ;
  ແລະ (ຂ) ລາຍຮັບທີ່ເກີດຂຶ້ນ ແລະ ທຶນທີ່ລະດົມໄດ້ຈາກເຄື່ອງມືທາງເສດຖະກິດທີ່ກ່ຽວຂ້ອງກັບຊີວະນາໆພັນ'
15-b-1-title: '(ກ) ການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ໃນການອະນຸລັກ ແລະ ການນຳໃຊ້ຊີວະນາໆພັນຢ່າງຍືນຍົງ;
  ແລະ (ຂ) ລາຍຮັບທີ່ເກີດຂຶ້ນ ແລະ ທຶນທີ່ລະດົມໄດ້ຈາກເຄື່ອງມືທາງເສດຖະກິດທີ່ກ່ຽວຂ້ອງກັບຊີວະນາໆພັນ'
15-c-1-title: 'ສັດສ່ວນຂອງສັດປ່າທີ່ຖືກຄ້າຂາຍ ເຊິ່ງມາຈາກການລັກລອບລ່າ ຫຼື ການຄ້າຂາຍທີ່ຜິດກົດໝາຍ'
16-1-1-title: 'ຈຳນວນຜູ້ຖືກເຄາະຮ້າຍຈາກການຄາດຕະກຳໂດຍເຈດຕະນາ ຕໍ່ປະຊາກອນ 100,000 ຄົນ,
  ແຍກຕາມເພດ ແລະ ອາຍຸ'
16-1-2-title: 'ຈຳນວນຜູ້ເສຍຊີວິດທີ່ກ່ຽວຂ້ອງກັບຂໍ້ຂັດແຍ່ງ ຕໍ່ປະຊາກອນ 100,000 ຄົນ, ແຍກຕາມເພດ,
  ອາຍຸ ແລະ ສາເຫດ'
16-1-3-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ເຄີຍປະເຊີນກັບ (ກ) ຄວາມຮຸນແຮງທາງຮ່າງກາຍ, (ຂ) ຄວາມຮຸນແຮງທາງຈິດໃຈ
  ແລະ/ຫຼື (ຄ) ຄວາມຮຸນແຮງທາງເພດ ໃນໄລຍະ 12 ເດືອນຜ່ານມາ'
16-1-4-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ຮູ້ສຶກປອດໄພໃນການຍ່າງຄົນດຽວໃນບໍລິເວນທີ່ພັກອາໄສຫຼັງຈາກມືດແລ້ວ'
16-10-1-title: 'ຈຳນວນກໍລະນີທີ່ໄດ້ຮັບການຢັ້ງຢືນກ່ຽວກັບການຂ້າ, ການລັກພາຕົວ, ການບັງຄັບໃຫ້ສູນຫາຍ,
  ການກັກຂັງໂດຍພະລະການ ແລະ ການທໍລະມານນັກຂ່າວ, ບຸກຄະລາກອນສື່ມວນຊົນ, ຜູ້ນຳສະຫະພັນກຳມະບານ
  ແລະ ຜູ້ປົກປ້ອງສິດທິມະນຸດ ໃນໄລຍະ 12 ເດືອນຜ່ານມາ'
16-10-2-title: 'ຈຳນວນປະເທດທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດການຮັບປະກັນທາງລັດຖະທຳມະນູນ,
  ກົດໝາຍ ແລະ/ຫຼື ນະໂຍບາຍ ເພື່ອໃຫ້ປະຊາຊົນສາມາດເຂົ້າເຖິງຂໍ້ມູນຂ່າວສານໄດ້'
16-2-1-title: 'ສັດສ່ວນຂອງເດັກອາຍຸ 1-17 ປີ ທີ່ເຄີຍຖືກລົງໂທດທາງຮ່າງກາຍ ແລະ/ຫຼື ຖືກຮຸກຮານທາງຈິດໃຈໂດຍຜູ້ເບິ່ງແຍງ
  ໃນເດືອນຜ່ານມາ'
16-2-2-title: 'ຈຳນວນຜູ້ຖືກເຄາະຮ້າຍຈາກການຄ້າມະນຸດ ຕໍ່ປະຊາກອນ 100,000 ຄົນ, ແຍກຕາມເພດ,
  ອາຍຸ ແລະ ຮູບແບບການຂູດຮີດ'
16-2-3-title: 'ສັດສ່ວນຂອງຊາວໜຸ່ມເພດຍິງ ແລະ ເພດຊາຍ ອາຍຸ 18-29 ປີ ທີ່ເຄີຍປະເຊີນກັບຄວາມຮຸນແຮງທາງເພດຕັ້ງແຕ່ກ່ອນອາຍຸ
  18 ປີ'
16-3-1-title: 'ສັດສ່ວນຂອງຜູ້ຖືກເຄາະຮ້າຍຈາກຄວາມຮຸນແຮງ ໃນໄລຍະ 12 ເດືອນຜ່ານມາ ທີ່ລາຍງານເຫດການຕໍ່ເຈົ້າໜ້າທີ່ທີ່ມີອຳນາດ
  ຫຼື ກົນໄກການແກ້ໄຂຂໍ້ຂັດແຍ່ງອື່ນໆທີ່ໄດ້ຮັບການຮັບຮອງຢ່າງເປັນທາງການ'
16-3-2-title: 'ສັດສ່ວນຂອງຜູ້ຖືກຄຸມຂັງທີ່ຍັງບໍ່ທັນຖືກຕັດສິນໂທດ ຕໍ່ຈຳນວນນັກໂທດທັງໝົດ'
16-4-1-title: 'ມູນຄ່າທັງໝົດຂອງກະແສການເງິນທີ່ຜິດກົດໝາຍຂາເຂົ້າ ແລະ ຂາອອກ (ເປັນໂດລາສະຫະລັດໃນປັດຈຸບັນ)'
16-4-2-title: 'ສັດສ່ວນຂອງອາວຸດທີ່ຖືກຍຶດ, ຖືກຄົ້ນພົບ ຫຼື ຖືກສົ່ງມອບ ເຊິ່ງມີແຫຼ່ງທີ່ມາທີ່ຜິດກົດໝາຍ
  ທີ່ໄດ້ຮັບການກວດສອບ ໂດຍເຈົ້າໜ້າທີ່ທີ່ມີອຳນາດ ຕາມເຄື່ອງມືສາກົນ'
16-5-1-title: 'ສັດສ່ວນຂອງບຸກຄົນທີ່ເຄີຍຕິດຕໍ່ກັບເຈົ້າໜ້າທີ່ລັດຢ່າງໜ້ອຍໜຶ່ງຄັ້ງ ແລະ
  ໄດ້ຈ່າຍເງິນສິນບົນ ຫຼື ຖືກຮຽກຮັບສິນບົນ ໃນໄລຍະ 12 ເດືອນຜ່ານມາ'
16-5-2-title: 'ສັດສ່ວນຂອງທຸລະກິດທີ່ເຄີຍຕິດຕໍ່ກັບເຈົ້າໜ້າທີ່ລັດຢ່າງໜ້ອຍໜຶ່ງຄັ້ງ ແລະ
  ໄດ້ຈ່າຍເງິນສິນບົນ ຫຼື ຖືກຮຽກຮັບສິນບົນ ໃນໄລຍະ 12 ເດືອນຜ່ານມາ'
16-6-1-title: 'ລາຍຈ່າຍເບື້ອງຕົ້ນຂອງລັດຖະບານ ຄິດເປັນສັດສ່ວນຂອງງົບປະມານທີ່ໄດ້ຮັບການອະນຸມັດໃນເບື້ອງຕົ້ນ,
  ແຍກຕາມຂະແໜງການ'
16-6-2-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ມີຄວາມເພິ່ງພໍໃຈຕໍ່ການບໍລິການສາທາລະນະໃນຄັ້ງຫຼ້າສຸດ'
16-7-1-title: 'ສັດສ່ວນຂອງຕຳແໜ່ງໃນສະຖາບັນລະດັບຊາດ ແລະ ທ້ອງຖິ່ນ (ນິຕິບັນຍັດ, ການບໍລິຫານລັດ,
  ຕຸລາການ) ທຽບໃສ່ການແຈກຢາຍລະດັບຊາດ, ແຍກຕາມເພດ, ອາຍຸ, ຄົນພິການ ແລະ ກຸ່ມປະຊາກອນ'
16-7-2-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ເຊື່ອວ່າການຕັດສິນໃຈແມ່ນມີສ່ວນຮ່ວມ ແລະ ຕອບສະໜອງ,
  ແຍກຕາມເພດ, ອາຍຸ, ຄວາມພິການ ແລະ ກຸ່ມປະຊາກອນ'
16-8-1-title: 'ສັດສ່ວນຂອງສະມາຊິກ ແລະ ສິດໃນການລົງຄະແນນສຽງຂອງປະເທດກຳລັງພັດທະນາ ໃນອົງການຈັດຕັ້ງສາກົນ'
16-9-1-title: 'ສັດສ່ວນຂອງເດັກອາຍຸຕ່ຳກວ່າ 5 ປີ ທີ່ໄດ້ຮັບການຈົດທະບຽນການເກີດກັບເຈົ້າໜ້າທີ່,
  ແຍກຕາມອາຍຸ'
16-a-1-title: 'ການມີຢູ່ຂອງສະຖາບັນສິດທິມະນຸດແຫ່ງຊາດທີ່ເປັນເອກະລາດ ຕາມຫຼັກການປາຣີ'
16-b-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ລາຍງານວ່າຕົນເອງເຄີຍຖືກເລືອກປະຕິບັດ ຫຼື ຖືກຄຸກຄາມ
  ໃນໄລຍະ 12 ເດືອນຜ່ານມາ ບົນພື້ນຖານການເລືອກປະຕິບັດທີ່ຖືກຫ້າມພາຍໃຕ້ກົດໝາຍສິດທິມະນຸດສາກົນ'
17-1-1-title: 'ລາຍຮັບທັງໝົດຂອງລັດຖະບານ ຄິດເປັນສັດສ່ວນຂອງ GDP, ແຍກຕາມແຫຼ່ງລາຍຮັບ'
17-1-2-title: 'ສັດສ່ວນຂອງງົບປະມານພາຍໃນທີ່ໄດ້ຮັບທຶນຈາກພາສີພາຍໃນ'
17-10-1-title: 'ຄ່າສະເລ່ຍພາສີຖ່ວງນ້ຳໜັກທົ່ວໂລກ'
17-11-1-title: 'ສັດສ່ວນການສົ່ງອອກທົ່ວໂລກຂອງປະເທດກຳລັງພັດທະນາ ແລະ ປະເທດດ້ອຍພັດທະນາ'
17-12-1-title: 'ຄ່າສະເລ່ຍພາສີຖ່ວງນ້ຳໜັກທີ່ປະເທດກຳລັງພັດທະນາ, ປະເທດດ້ອຍພັດທະນາ ແລະ
  ປະເທດກຳລັງພັດທະນາທີ່ເປັນເກາະນ້ອຍປະເຊີນ'
17-13-1-title: 'ຕາຕະລາງສະຫຼຸບຂໍ້ມູນເສດຖະກິດມະຫາພາກ'
17-14-1-title: 'ຈຳນວນປະເທດທີ່ມີກົນໄກເພື່ອເສີມສ້າງຄວາມສອດຄ່ອງທາງດ້ານນະໂຍບາຍຂອງການພັດທະນາທີ່ຍືນຍົງ'
17-15-1-title: 'ຂອບເຂດການນຳໃຊ້ຂອບວຽກການຕິດຕາມຜົນ ແລະ ເຄື່ອງມືການວາງແຜນຂອງປະເທດຜູ້ຮັບ
  ໂດຍຜູ້ໃຫ້ການຮ່ວມມືເພື່ອການພັດທະນາ'
17-16-1-title: 'ຈຳນວນປະເທດທີ່ລາຍງານຄວາມຄືບໜ້າໃນຂອບການຕິດຕາມປະສິດທິຜົນການພັດທະນາແບບຫຼາຍຝ່າຍ
  ທີ່ສະໜັບສະໜູນການບັນລຸເປົ້າໝາຍການພັດທະນາທີ່ຍືນຍົງ'
17-17-1-title: 'ຈຳນວນເງິນໂດລາສະຫະລັດທີ່ໃຫ້ຄຳໝັ້ນສັນຍາສຳລັບການຮ່ວມມືລະຫວ່າງພາກລັດ ແລະ
  ເອກະຊົນ (PPP) ໃນດ້ານໂຄງລ່າງພື້ນຖານ'
17-18-1-title: 'ຕົວຊີ້ວັດຂີດຄວາມສາມາດດ້ານສະຖິຕິ'
17-18-2-title: 'ຈຳນວນປະເທດທີ່ມີກົດໝາຍສະຖິຕິແຫ່ງຊາດ ທີ່ສອດຄ່ອງກັບຫຼັກການພື້ນຖານຂອງສະຖິຕິທາງການ'
17-18-3-title: 'ຈຳນວນປະເທດທີ່ມີແຜນສະຖິຕິແຫ່ງຊາດ ທີ່ໄດ້ຮັບງົບປະມານເຕັມສ່ວນ ແລະ ພວມຈັດຕັ້ງປະຕິບັດ,
  ແຍກຕາມແຫຼ່ງທຶນ'
17-19-1-title: 'ມູນຄ່າເປັນໂດລາຂອງຊັບພະຍາກອນທັງໝົດ ທີ່ຈັດສັນເພື່ອເສີມສ້າງຂີດຄວາມສາມາດດ້ານສະຖິຕິໃນປະເທດກຳລັງພັດທະນາ'
17-19-2-title: 'ສັດສ່ວນຂອງປະເທດທີ່ (ກ) ໄດ້ດຳເນີນການສຳມະໂນປະຊາກອນ ແລະ ທີ່ຢູ່ອາໄສຢ່າງໜ້ອຍໜຶ່ງຄັ້ງໃນຮອບ
  10 ປີຜ່ານມາ; ແລະ (ຂ) ບັນລຸການຈົດທະບຽນການເກີດ 100% ແລະ ການຈົດທະບຽນການຕາຍ 80%'
17-2-1-title: 'ການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການສຸດທິ (ທັງໝົດ ແລະ ທີ່ໃຫ້ແກ່ປະເທດດ້ອຍພັດທະນາ)
  ຄິດເປັນສັດສ່ວນຂອງລາຍໄດ້ແຫ່ງຊາດລວມ (GNI) ຂອງປະເທດຜູ້ໃຫ້ທຶນໃນຄະນະກຳມະການ DAC ຂອງ OECD'
17-3-1-title: 'ຊັບພະຍາກອນທາງດ້ານການເງິນເພີ່ມເຕີມ ທີ່ລະດົມໃຫ້ແກ່ປະເທດກຳລັງພັດທະນາຈາກຫຼາຍແຫຼ່ງທຶນ'
17-3-2-title: 'ປະລິມານເງິນໂອນກັບຄືນປະເທດ (ເປັນໂດລາສະຫະລັດ) ຄິດເປັນສັດສ່ວນຂອງ GDP ທັງໝົດ'
17-4-1-title: 'ການຊຳລະໜີ້ສິນ ຄິດເປັນສັດສ່ວນຂອງການສົ່ງອອກສິນຄ້າ ແລະ ການບໍລິການ'
17-5-1-title: 'ຈຳນວນປະເທດທີ່ຮັບຮອງ ແລະ ຈັດຕັ້ງປະຕິບັດລະບອບການສົ່ງເສີມການລົງທຶນສຳລັບປະເທດກຳລັງພັດທະນາ,
  ລວມທັງປະເທດດ້ອຍພັດທະນາ'
17-6-1-title: 'ຈຳນວນຜູ້ສະໝັກໃຊ້ບໍລິການອິນເຕີເນັດຄວາມໄວສູງ (Broadband) ແບບຄົງທີ່ ຕໍ່ປະຊາກອນ
  100 ຄົນ, ແຍກຕາມຄວາມໄວ'
17-6-2-title: 'ຈຳນວນຜູ້ສະໝັກໃຊ້ບໍລິການອິນເຕີເນັດຄວາມໄວສູງແບບຄົງທີ່ ຕໍ່ປະຊາກອນ 100
  ຄົນ, ແຍກຕາມຄວາມໄວ'
17-7-1-title: 'ຈຳນວນທຶນທັງໝົດສຳລັບປະເທດກຳລັງພັດທະນາ ແລະ ປະເທດພັດທະນາແລ້ວ ເພື່ອສົ່ງເສີມການພັດທະນາ,
  ການຖ່າຍທອດ ແລະ ການເຜີຍແຜ່ເຕັກໂນໂລຢີທີ່ເປັນມິດກັບສິ່ງແວດລ້ອມ'
17-8-1-title: 'ສັດສ່ວນຂອງບຸກຄົນທີ່ນຳໃຊ້ອິນເຕີເນັດ'
17-9-1-title: 'ມູນຄ່າເປັນໂດລາຂອງການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ທີ່ໃຫ້ຄຳໝັ້ນສັນຍາແກ່ປະເທດກຳລັງພັດທະນາ'
2-1-1-title: 'ອັດຕາຄວາມແຜ່ຫຼາຍຂອງການຂາດສານອາຫານ'
2-1-2-title: 'ອັດຕາຄວາມແຜ່ຫຼາຍຂອງຄວາມບໍ່ໝັ້ນຄົງທາງດ້ານອາຫານໃນລະດັບປານກາງ ຫຼື ຮ້າຍແຮງໃນກຸ່ມປະຊາກອນ,
  ອີງຕາມມາດຕາສ່ວນປະສົບການຄວາມບໍ່ໝັ້ນຄົງທາງດ້ານອາຫານ (FIES)'
2-2-1-title: 'ອັດຕາຄວາມແຜ່ຫຼາຍຂອງພາວະເຕ້ຍ (ລວງສູງທຽບຕາມເກນອາຍຸ < -2 ຄ່າຜັນປ່ຽນມາດຕະຖານຈາກຄ່າກາງຂອງມາດຕະຖານການເຕີບໂຕຂອງເດັກໂດຍ
  WHO) ໃນກຸ່ມເດັກອາຍຸຕ່ຳກວ່າ 5 ປີ'
2-2-2-title: 'ອັດຕາຄວາມແຜ່ຫຼາຍຂອງພາວະທຸໂພຊະນາການ (ນ້ຳໜັກທຽບຕາມລວງສູງ > +2 ຫຼື < -2
  ຄ່າຜັນປ່ຽນມາດຕະຖານຈາກຄ່າກາງຂອງມາດຕະຖານ WHO) ໃນກຸ່ມເດັກອາຍຸຕ່ຳກວ່າ 5 ປີ, ແຍກຕາມປະເພດ
  (ຈ່ອຍຜອມ ແລະ ນ້ຳໜັກເກີນ)'
2-3-1-title: 'ປະລິມານການຜະລິດຕໍ່ຫົວໜ່ວຍແຮງງານ ແຍກຕາມຂະໜາດຂອງວິສາຫະກິດກະສິກຳ/ລ້ຽງສັດ/ປ່າໄມ້'
2-3-2-title: 'ລາຍໄດ້ສະເລ່ຍຂອງຜູ້ຜະລິດອາຫານຂະໜາດນ້ອຍ, ແຍກຕາມເພດ ແລະ ສະຖານະພາບຊົນເຜົ່າ'
2-4-1-title: 'ສັດສ່ວນຂອງເນື້ອທີ່ກະສິກຳທີ່ມີການຜະລິດ ແລະ ກະສິກຳທີ່ຍືນຍົງ'
2-5-1-title: 'ຈຳນວນຊັບພະຍາກອນພັນທຸກຳ (ກ) ພືດ ແລະ (ຂ) ສັດ ສຳລັບອາຫານ ແລະ ການກະສິກຳ
  ທີ່ໄດ້ຮັບການຮັກສາໄວ້ ໃນສະຖານທີ່ອະນຸລັກໄລຍະກາງ ຫຼື ໄລຍະຍາວ'
2-5-2-title: 'ສັດສ່ວນຂອງສາຍພັນທ້ອງຖິ່ນ ແລະ ສາຍພັນຂ້າມແດນ ທີ່ຖືກຈັດຢູ່ໃນກຸ່ມທີ່ມີຄວາມສ່ຽງຕໍ່ການສູນພັນ'
2-a-1-title: 'ດັດຊະນີການໃຫ້ຄວາມສຳຄັນແກ່ຂະແໜງກະສິກຳ ໃນການໃຊ້ຈ່າຍຂອງລັດຖະບານ'
2-a-2-title: 'ກະແສການເງິນທາງການທັງໝົດ (ການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ບວກກັບ
  ກະແສການເງິນທາງການອື່ນໆ) ທີ່ໃຫ້ແກ່ຂະແໜງກະສິກຳ'
2-b-1-title: 'ການອຸດໜູນການສົ່ງອອກສິນຄ້າກະສິກຳ'
2-c-1-title: 'ຕົວຊີ້ວັດຄວາມຜິດປົກກະຕິຂອງລາຄາອາຫານ'
3-1-1-title: 'ອັດຕາສ່ວນການຕາຍຂອງມານດາ'
3-1-2-title: 'ສັດສ່ວນຂອງການເກີດທີ່ມີບຸກຄະລາກອນທາງການແພດທີ່ມີທັກສະຊ່ວຍປະສູດ'
3-2-1-title: 'ອັດຕາການຕາຍຂອງເດັກອາຍຸຕ່ຳກວ່າ 5 ປີ'
3-2-2-title: 'ອັດຕາການຕາຍຂອງເດັກເກີດໃໝ່'
3-3-1-title: 'ຈຳນວນຜູ້ຕິດເຊື້ອ HIV ໃໝ່ ຕໍ່ປະຊາກອນທີ່ບໍ່ຕິດເຊື້ອ 1,000 ຄົນ, ແຍກຕາມເພດ,
  ອາຍຸ ແລະ ກຸ່ມປະຊາກອນເປົ້າໝາຍ'
3-3-2-title: 'ອັດຕາການເກີດພະຍາດວັນນະໂຣກ ຕໍ່ປະຊາກອນ 100,000 ຄົນ'
3-3-3-title: 'ອັດຕາການເກີດພະຍາດໄຂ້ຍຸງ ຕໍ່ປະຊາກອນ 1,000 ຄົນ'
3-3-4-title: 'ອັດຕາການເກີດພະຍາດຕັບອັກເສບບີ ຕໍ່ປະຊາກອນ 100,000 ຄົນ'
3-3-5-title: 'ຈຳນວນຜູ້ທີ່ຕ້ອງການການປິ່ນປົວ/ປ້ອງກັນພະຍາດເຂດຮ້ອນທີ່ຖືກລະເລີຍ'
3-4-1-title: 'ອັດຕາການຕາຍຈາກພະຍາດຫຼອດເລືອດຫົວໃຈ, ມະເຮັງ, ເບົາຫວານ ຫຼື ພະຍາດທາງເດີນຫາຍໃຈຊ້ຳເຮື້ອ'
3-4-2-title: 'ອັດຕາການຕາຍຈາກການຂ້າຕົວຕາຍ'
3-5-1-title: 'ຂອບເຂດການປິ່ນປົວ (ທາງຢາ, ທາງຈິດຕະສັງຄົມ ແລະ ການຟື້ນຟູສຸຂະພາບ) ສຳລັບຜູ້ທີ່ຜິດປົກກະຕິຈາກການນຳໃຊ້ສານເສບຕິດ'
3-5-2-title: 'ປະລິມານການບໍລິໂພກທາດເຫຼົ້າຕໍ່ຫົວຄົນ (ອາຍຸ 15 ປີຂຶ້ນໄປ) ໃນຮອບປີປະຕິທິນ
  ເປັນລິດຂອງທາດເຫຼົ້າບໍລິສຸດ'
3-6-1-title: 'ອັດຕາການຕາຍຈາກການບາດເຈັບທາງການຈະລາຈອນທາງບົກ'
3-7-1-title: 'ສັດສ່ວນຂອງແມ່ຍິງໄວຈະເລີນພັນ (ອາຍຸ 15-49 ປີ) ທີ່ມີຄວາມຕ້ອງການການວາງແຜນຄອບຄົວ
  ໄດ້ຮັບການຕອບສະໜອງດ້ວຍວິທີທີ່ທັນສະໄໝ'
3-7-2-title: 'ອັດຕາການເກີດຂອງໄວໜຸ່ມ (ອາຍຸ 10-14 ປີ; ອາຍຸ 15-19 ປີ) ຕໍ່ແມ່ຍິງ 1,000
  ຄົນໃນກຸ່ມອາຍຸນັ້ນ'
3-8-1-title: 'ຂອບເຂດການບໍລິການດ້ານສາທາລະນະສຸກທີ່ຈຳເປັນ'
3-8-2-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ມີລາຍຈ່າຍຂອງຄົວເຮືອນໃນດ້ານສຸຂະພາບສູງ ທຽບໃສ່ລາຍຈ່າຍ
  ຫຼື ລາຍໄດ້ທັງໝົດຂອງຄົວເຮືອນ'
3-9-1-title: 'ອັດຕາການຕາຍຈາກມົນລະພິດທາງອາກາດພາຍໃນເຮືອນ ແລະ ອາກາດລ້ອມຮອບ'
3-9-2-title: 'ອັດຕາການຕາຍຈາກນ້ຳທີ່ບໍ່ປອດໄພ, ສຸຂາພິບານທີ່ບໍ່ປອດໄພ ແລະ ການຂາດສຸຂະອະນາໄມ
  (WASH)'
3-9-3-title: 'ອັດຕາການຕາຍຈາກການໄດ້ຮັບສານພິດໂດຍບໍ່ໄດ້ເຈດຕະນາ'
3-a-1-title: 'ອັດຕາຄວາມແຜ່ຫຼາຍຂອງການນຳໃຊ້ຢາສູບໃນປັດຈຸບັນ ໃນກຸ່ມຜູ້ທີ່ມີອາຍຸ 15 ປີຂຶ້ນໄປ
  (ປັບຕາມມາດຕະຖານອາຍຸ)'
3-b-1-title: 'ສັດສ່ວນຂອງປະຊາກອນເປົ້າໝາຍ ທີ່ໄດ້ຮັບການຄຸ້ມຄອງດ້ວຍວັກຊີນທັງໝົດທີ່ລວມຢູ່ໃນແຜນງານແຫ່ງຊາດ'
3-b-2-title: 'ການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການສຸດທິທັງໝົດ ໃຫ້ແກ່ການຄົ້ນຄວ້າທາງການແພດ
  ແລະ ຂະແໜງສາທາລະນະສຸກຂັ້ນພື້ນຖານ'
3-b-3-title: 'ດັດຊະນີການເຂົ້າເຖິງຜະລິດຕະພັນທາງການແພດ'
3-c-1-title: 'ຄວາມໜາແໜ້ນ ແລະ ການແຈກຢາຍຂອງບຸກຄະລາກອນທາງການແພດ'
3-d-1-title: 'ຂີດຄວາມສາມາດຕາມກົດລະບຽບສຸຂະພາບສາກົນ (IHR) ແລະ ການກຽມພ້ອມຮັບມືກັບພາວະສຸກເສີນດ້ານສາທາລະນະສຸກ'
4-1-1-title: 'ສັດສ່ວນຂອງເດັກນ້ອຍ ແລະ ຊາວໜຸ່ມ (ກ) ໃນຊັ້ນ ປ.2/ປ.3; (ຂ) ເມື່ອຈົບຊັ້ນປະຖົມ;
  ແລະ (ຄ) ເມື່ອຈົບຊັ້ນມັດທະຍົມຕອນຕົ້ນ ທີ່ບັນລຸລະດັບຄວາມຮູ້ຄວາມສາມາດຂັ້ນຕ່ຳໃນ (i) ການອ່ານ
  ແລະ (ii) ຄະນິດສາດ, ແຍກຕາມເພດ'
4-2-1-title: 'ສັດສ່ວນຂອງເດັກອາຍຸ 24-59 ເດືອນ ທີ່ມີການພັດທະນາຕາມເກນທັງທາງດ້ານສຸຂະພາບ,
  ການຮຽນຮູ້ ແລະ ສະຫວັດດີການທາງຈິດຕະສັງຄົມ, ແຍກຕາມເພດ'
4-2-2-title: 'ອັດຕາການມີສ່ວນຮ່ວມໃນການຮຽນຮູ້ທີ່ມີການຈັດຕັ້ງ (ໜຶ່ງປີກ່ອນເກນອາຍຸເຂົ້າຮຽນຊັ້ນປະຖົມ),
  ແຍກຕາມເພດ'
4-3-1-title: 'ອັດຕາການມີສ່ວນຮ່ວມຂອງຊາວໜຸ່ມ ແລະ ຜູ້ໃຫຍ່ ໃນການສຶກສາ ແລະ ການຝຶກອົບຮົມທັງໃນ
  ແລະ ນອກລະບົບ ໃນໄລຍະ 12 ເດືອນຜ່ານມາ, ແຍກຕາມເພດ'
4-4-1-title: 'ສັດສ່ວນຂອງຊາວໜຸ່ມ ແລະ ຜູ້ໃຫຍ່ ທີ່ມີທັກສະດ້ານເຕັກໂນໂລຢີຂໍ້ມູນຂ່າວສານ
  ແລະ ການສື່ສານ (ICT), ແຍກຕາມປະເພດທັກສະ'
4-5-1-title: 'ດັດຊະນີຄວາມສະເໝີພາບ (ຍິງ/ຊາຍ, ຊົນນະບົດ/ຕົວເມືອງ, ກຸ່ມລາຍໄດ້ຕໍ່າສຸດ/ສູງສຸດ
  ແລະ ອື່ນໆ) ສຳລັບທຸກຕົວຊີ້ວັດດ້ານການສຶກສາທີ່ສາມາດແຍກຂໍ້ມູນໄດ້'
4-6-1-title: 'ອັດຕາການຮູ້ໜັງສືຂອງຊາວໜຸ່ມ ແລະ ຜູ້ໃຫຍ່'
4-7-1-title: 'ຂອບເຂດທີ່ (i) ການສຶກສາຄວາມເປັນພົນລະເມືອງໂລກ ແລະ (ii) ການສຶກສາເພື່ອການພັດທະນາທີ່ຍືນຍົງ
  ຖືກລວມເຂົ້າໃນ (ກ) ນະໂຍບາຍການສຶກສາແຫ່ງຊາດ; (ຂ) ຫຼັກສູດການສອນ; (ຄ) ການສຶກສາຂອງຄູ;
  ແລະ (ງ) ການປະເມີນນັກຮຽນ'
4-a-1-title: 'ສັດສ່ວນຂອງໂຮງຮຽນທີ່ມີການບໍລິການຂັ້ນພື້ນຖານ, ແຍກຕາມປະເພດການບໍລິການ'
4-b-1-title: 'ປະລິມານການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ສຳລັບທຶນການສຶກສາ'
4-c-1-title: 'ສັດສ່ວນຂອງຄູທີ່ມີຄຸນວຸດທິຂັ້ນຕ່ຳຕາມທີ່ກຳນົດ, ແຍກຕາມລະດັບການສຶກສາ'
5-1-1-title: 'ການມີຂອບວຽກດ້ານກົດໝາຍເພື່ອສົ່ງເສີມ, ບັງຄັບໃຊ້ ແລະ ຕິດຕາມຄວາມສະເໝີພາບ
  ແລະ ການບໍ່ເລືອກປະຕິບັດທາງເພດ'
5-2-1-title: 'ສັດສ່ວນຂອງແມ່ຍິງ ແລະ ເດັກຍິງອາຍຸ 15 ປີຂຶ້ນໄປ ທີ່ເຄີຍມີຄູ່ຄອງ ແລະ ຖືກຄວາມຮຸນແຮງທາງຮ່າງກາຍ,
  ທາງເພດ ຫຼື ທາງຈິດໃຈ ຈາກຄູ່ຄອງຄົນປັດຈຸບັນ ຫຼື ຄົນກ່ອນ ໃນໄລຍະ 12 ເດືອນຜ່ານມາ'
5-2-2-title: 'ສັດສ່ວນຂອງແມ່ຍິງ ແລະ ເດັກຍິງອາຍຸ 15 ປີຂຶ້ນໄປ ທີ່ຖືກຄວາມຮຸນແຮງທາງເພດຈາກບຸກຄົນອື່ນທີ່ບໍ່ແມ່ນຄູ່ຄອງ
  ໃນໄລຍະ 12 ເດືອນຜ່ານມາ, ແຍກຕາມອາຍຸ ແລະ ສະຖານທີ່ເກີດເຫດ'
5-3-1-title: 'ສັດສ່ວນຂອງແມ່ຍິງອາຍຸ 20-24 ປີ ທີ່ແຕ່ງງານ ຫຼື ຢູ່ກິນນຳກັນກ່ອນອາຍຸ 15
  ປີ ແລະ ກ່ອນອາຍຸ 18 ປີ'
5-3-2-title: 'ສັດສ່ວນຂອງເດັກຍິງ ແລະ ແມ່ຍິງອາຍຸ 15-49 ປີ ທີ່ຜ່ານການຕັດອະໄວຍະວະເພດຍິງ,
  ແຍກຕາມອາຍຸ'
5-4-1-title: 'ສັດສ່ວນຂອງເວລາທີ່ໃຊ້ໃນການເຮັດວຽກບ້ານ ແລະ ການເບິ່ງແຍງທີ່ບໍ່ໄດ້ຮັບຄ່າຈ້າງ,
  ແຍກຕາມເພດ, ອາຍຸ ແລະ ທີ່ຕັ້ງ'
5-5-1-title: 'ສັດສ່ວນຂອງບ່ອນນັ່ງທີ່ຖືຄອງໂດຍແມ່ຍິງໃນ (ກ) ສະພາແຫ່ງຊາດ ແລະ (ຂ) ອົງການປົກຄອງທ້ອງຖິ່ນ'
5-5-2-title: 'ສັດສ່ວນຂອງແມ່ຍິງໃນຕຳແໜ່ງບໍລິຫານ'
5-6-1-title: 'ສັດສ່ວນຂອງແມ່ຍິງອາຍຸ 15-49 ປີ ທີ່ຕັດສິນໃຈດ້ວຍຕົນເອງກ່ຽວກັບຄວາມສຳພັນທາງເພດ,
  ການນຳໃຊ້ວິທີຄຸມກຳເນີດ ແລະ ການເບິ່ງແຍງສຸຂະພາບຈະເລີນພັນ'
5-6-2-title: 'ຈຳນວນປະເທດທີ່ມີກົດໝາຍ ແລະ ລະບຽບການທີ່ຮັບປະກັນການເຂົ້າເຖິງການເບິ່ງແຍງສຸຂະພາບທາງເພດ
  ແລະ ການຈະເລີນພັນ, ຂໍ້ມູນຂ່າວສານ ແລະ ການສຶກສາຢ່າງເຕັມສ່ວນ ແລະ ສະເໝີພາບ ສຳລັບແມ່ຍິງ
  ແລະ ຜູ້ຊາຍອາຍຸ 15 ປີຂຶ້ນໄປ'
5-a-1-title: '(ກ) ສັດສ່ວນຂອງປະຊາກອນກະສິກຳທີ່ມີສິດເປັນເຈົ້າຂອງ ຫຼື ສິດຄອບຄອງທີ່ດິນກະສິກຳຢ່າງປອດໄພ,
  ແຍກຕາມເພດ; ແລະ (ຂ) ສັດສ່ວນຂອງແມ່ຍິງໃນບັນດາເຈົ້າຂອງ ຫຼື ຜູ້ຖືສິດຄອບຄອງທີ່ດິນກະສິກຳ'
5-a-2-title: 'ສັດສ່ວນຂອງປະເທດທີ່ຂອບວຽກດ້ານກົດໝາຍ (ລວມທັງກົດໝາຍຮີດຄອງປະເພນີ) ຮັບປະກັນສິດທີ່ສະເໝີພາບຂອງແມ່ຍິງໃນການເປັນເຈົ້າຂອງ
  ແລະ/ຫຼື ການຄວບຄຸມທີ່ດິນ'
5-b-1-title: 'ສັດສ່ວນຂອງບຸກຄົນທີ່ມີໂທລະສັບມືຖືເປັນຂອງຕົນເອງ, ແຍກຕາມເພດ'
5-c-1-title: 'ສັດສ່ວນຂອງປະເທດທີ່ມີລະບົບຕິດຕາມ ແລະ ເປີດເຜີຍການຈັດສັນງົບປະມານເພື່ອຄວາມສະເໝີພາບທາງເພດ
  ແລະ ການສ້າງຄວາມເຂັ້ມແຂງໃຫ້ແກ່ແມ່ຍິງ'
6-1-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ນຳໃຊ້ບໍລິການນ້ຳດື່ມທີ່ຄຸ້ມຄອງຢ່າງປອດໄພ'
6-2-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ນຳໃຊ້ (ກ) ບໍລິການສຸຂາພິບານທີ່ຄຸ້ມຄອງຢ່າງປອດໄພ ແລະ
  (ຂ) ສະຖານທີ່ລ້າງມືທີ່ມີສະບູ ແລະ ນ້ຳ'
6-3-1-title: 'ສັດສ່ວນຂອງນ້ຳເສຍຈາກຄົວເຮືອນ ແລະ ອຸດສາຫະກຳ ທີ່ໄດ້ຮັບການບຳບັດຢ່າງປອດໄພ'
6-3-2-title: 'ສັດສ່ວນຂອງແຫຼ່ງນ້ຳທີ່ມີຄຸນນະພາບນ້ຳໃນທຳມະຊາດຢູ່ໃນເກນດີ'
6-4-1-title: 'ການປ່ຽນແປງຂອງປະສິດທິພາບການນຳໃຊ້ນ້ຳຕາມໄລຍະເວລາ'
6-4-2-title: 'ລະດັບຄວາມຕຶງຄຽດດ້ານນ້ຳ: ປະລິມານການນຳໃຊ້ນ້ຳຈືດ ຄິດເປັນສັດສ່ວນຂອງຊັບພະຍາກອນນ້ຳຈືດທີ່ມີຢູ່'
6-5-1-title: 'ລະດັບການຈັດຕັ້ງປະຕິບັດການຄຸ້ມຄອງຊັບພະຍາກອນນ້ຳແບບສົມບູນ'
6-5-2-title: 'ສັດສ່ວນຂອງເນື້ອທີ່ອ່າງນ້ຳຂ້າມຊາຍແດນ ທີ່ມີຂໍ້ຕົກລົງການຮ່ວມມືດ້ານນ້ຳທີ່ມີຜົນບັງຄັບໃຊ້'
6-6-1-title: 'ການປ່ຽນແປງຂອງຂອບເຂດລະບົບນິເວດທີ່ກ່ຽວຂ້ອງກັບນ້ຳຕາມໄລຍະເວລາ'
6-a-1-title: 'ຈຳນວນການຊ່ວຍເຫຼືອເພື່ອການພັດທະນາຢ່າງເປັນທາງການ ທີ່ກ່ຽວຂ້ອງກັບນ້ຳ ແລະ
  ສຸຂາພິບານ ເຊິ່ງເປັນສ່ວນໜຶ່ງຂອງແຜນການໃຊ້ຈ່າຍທີ່ລັດຖະບານປະສານງານ'
6-b-1-title: 'ສັດສ່ວນຂອງໜ່ວຍງານບໍລິຫານທ້ອງຖິ່ນທີ່ມີນະໂຍບາຍ ແລະ ຂັ້ນຕອນການມີສ່ວນຮ່ວມຂອງຊຸມຊົນທ້ອງຖິ່ນ
  ໃນການຄຸ້ມຄອງນ້ຳ ແລະ ສຸຂາພິບານ'
7-1-1-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ສາມາດເຂົ້າເຖິງໄຟຟ້າ'
7-1-2-title: 'ສັດສ່ວນຂອງປະຊາກອນທີ່ເພິ່ງພາເຊື້ອໄຟ ແລະ ເຕັກໂນໂລຢີທີ່ສະອາດເປັນຫຼັກ'
7-2-1-title: 'ສັດສ່ວນຂອງພະລັງງານທົດແທນໃນການບໍລິໂພກພະລັງງານຂັ້ນສຸດທ້າຍທັງໝົດ'
7-3-1-title: 'ຄວາມເຂັ້ມຂຸ້ນຂອງການນຳໃຊ້ພະລັງງານ ວັດແທກໃນແງ່ຂອງພະລັງງານຂັ້ນຕົ້ນ ແລະ
  GDP'
7-a-1-title: 'ກະແສການເງິນສາກົນທີ່ໃຫ້ແກ່ປະເທດກຳລັງພັດທະນາ ເພື່ອສະໜັບສະໜູນການຄົ້ນຄວ້າ
  ແລະ ພັດທະນາພະລັງງານສະອາດ ແລະ ການຜະລິດພະລັງງານທົດແທນ'
7-b-1-title: 'ກຳລັງການຜະລິດພະລັງງານທົດແທນທີ່ຕິດຕັ້ງໃນປະເທດກຳລັງພັດທະນາ ແລະ ປະເທດພັດທະນາແລ້ວ
  (ເປັນວັດຕໍ່ຫົວຄົນ)'
8-1-1-title: 'ອັດຕາການເຕີບໂຕປະຈຳປີຂອງ GDP ຕົວຈິງຕໍ່ຫົວຄົນ'
8-10-1-title: '(ກ) ຈຳນວນສາຂາທະນາຄານທຸລະກິດ ຕໍ່ຜູ້ໃຫຍ່ 100,000 ຄົນ ແລະ (ຂ) ຈຳນວນຕູ້
  ATM ຕໍ່ຜູ້ໃຫຍ່ 100,000 ຄົນ'
8-10-2-title: 'ສັດສ່ວນຂອງຜູ້ໃຫຍ່ (ອາຍຸ 15 ປີຂຶ້ນໄປ) ທີ່ມີບັນຊີທະນາຄານ ຫຼື ສະຖາບັນການເງິນອື່ນໆ
  ຫຼື ໃຊ້ບໍລິການເງິນຜ່ານມືຖື'
8-2-1-title: 'ອັດຕາການເຕີບໂຕປະຈຳປີຂອງ GDP ຕົວຈິງຕໍ່ຜູ້ມີວຽກເຮັດງານທຳ'
8-3-1-title: 'ສັດສ່ວນຂອງການຈ້າງງານນອກລະບົບໃນການຈ້າງງານທັງໝົດ, ແຍກຕາມຂະແໜງການ ແລະ ເພດ'

  GDP'
8-4-2-title: 'ການບໍລິໂພກວັດສະດຸພາຍໃນປະເທດ, ການບໍລິໂພກວັດສະດຸພາຍໃນປະເທດຕໍ່ຫົວຄົນ, ແລະ

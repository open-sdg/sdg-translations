internet_explorer_message_title: ບຣາວເຊີນີ້ບໍ່ໄດ້ຮັບການຮອງຮັບອີກຕໍ່ໄປ
internet_explorer_message: ພວກເຮົາກວດພົບວ່າທ່ານກຳລັງໃຊ້ Internet Explorer 
  ເພື່ອເຂົ້າເບິ່ງເວັບໄຊນີ້. ປັດຈຸບັນ Microsoft ໄດ້ຢຸດການພັດທະນາ Internet 
  Explorer ແລ້ວ. ດັ່ງນັ້ນ, ເວັບໄຊນີ້ຈຶ່ງບໍ່ຮອງຮັບ Internet Explorer ທຸກເວີຊັນ. 
  ບາງຄຸນສົມບັດໃນເວັບໄຊນີ້ອາດຈະບໍ່ເຮັດວຽກ. ທ່ານຄວນໃຊ້ບຣາວເຊີທີ່ທັນສະໄໝເຊັ່ນ Edge,
  Chrome, Firefox ຫຼື Safari. ຖ້າທ່ານມີຂໍ້ຫຍຸ້ງຍາກໃນການຕິດຕັ້ງ ຫຼື 
  ການເຂົ້າເຖິງບຣາວເຊີອື່ນ, ກະລຸນາຕິດຕໍ່ທີມງານຊ່ວຍເຫຼືອດ້ານໄອທີ (IT) ຂອງທ່ານ.
